# Auto-enable auto-merge on PRs that are gated. Two paths:
#   STANDARD (R-3 review path):
#     * rollback-safe        — reversible by git revert
#     * adversarial-reviewed — 3-lens review passed
#     * NOT needs-jon-approval — Jon still eyes money/prod-touching code
#   FAST PATH (T2 auto-merge, 2026-11-05):
#     * fast-path            — auto-applied by .github/workflows/auto-label-fast-path.yml
#                              when the entire diff is docs / tests / fixtures /
#                              generated types / apps/training / scripts.
#                              NOTE (2026-11-11): between 2026-11-05 and
#                              2026-11-11 this ALSO covered apps/web/src/ and
#                              apps/worker/src/, i.e. all product code, so this
#                              comment was false and ~5,100 lines of the
#                              play-along player merged with no independent
#                              review. Implementation is out of the allowlist
#                              again; it takes the STANDARD path above.
#     * NOT needs-jon-approval — hard stop regardless
# When conditions hold, the merge step calls REST
# `PUT /repos/{owner}/{repo}/pulls/{N}/merge` directly. GitHub's required
# status checks still gate the actual merge — and as of 2026-11-05 the
# v3/main ruleset finally HAS required status checks (audit finding F1), so
# that sentence is now true at the platform level rather than aspirational.
#
# ── CREDENTIAL CHAIN (L2.1, 2026-11-05) ──────────────────────────────────
#
#   GitHub App installation token  >  BOT_TOKEN  >  GITHUB_TOKEN
#
# Why an App: fine-grained PATs cannot use GraphQL's `mergePullRequest`
# mutation (cli/cli#8352, cli/cli#8651), which is what made the bot unable
# to merge. This workflow already sidestepped that by using REST — the
# remaining problem was credential scope and attribution. An App
# installation token is scoped to two permissions on one repo and expires
# in an hour, a better posture than a classic PAT carrying `repo` scope
# account-wide.
#
# The mint step is `continue-on-error: true` ON PURPOSE. If APP_ID is unset
# or the mint fails, it must NOT take the merge down with it; the `||`
# chain then falls back to exactly the previous behaviour, so the worst
# case is "no change", never "auto-merge is broken". It is continue-on-error
# rather than a conditional because the `secrets` context is not available
# in step-level `if`.
#
# Because that fail-open is deliberately silent, a separate step logs WHICH
# credential won as a ::notice:: (never the token itself). Without it, a
# silently-failed mint would look identical to a working App. **That notice
# is the only evidence that L2.1 actually works** — nothing else proves it,
# because the agent cannot read /actions/secrets to confirm APP_ID exists.
#
# The App is deliberately NOT in the ruleset's bypass_actors: it merges
# under the same required checks as a human.
#
# ── BRANCH-PROTECTION BLOCKS ARE NO LONGER SILENT (L2.4, 2026-11-05) ─────
#
# Audit finding F7. A refused merge used to log two ::notice:: lines and
# exit 0. From the PR page that is indistinguishable from success: a green
# check, an unmerged PR, and no stated reason anywhere a reader would look.
#
# IMPORTANT, and a correction to how this is often described: the check-run
# `conclusion` does NOT distinguish the two outcomes. It is `success` for
# both a completed merge and a branch-protection refusal, deliberately —
# see the long comment at the refusal branch for why a `failure` here would
# trip safe_merge.sh's M-1 and wedge the PR a human must then merge by hand.
#
# What distinguishes them is therefore NOT a conclusion value but:
#   1. a PR COMMENT naming the rule GitHub cited, refreshed via PATCH on
#      re-runs (keyed on an HTML marker, so one comment per PR), and
#   2. the ::notice:: line in the run log.
# If you are looking for "did it merge?", check whether the PR is merged —
# not this workflow's conclusion.
#
# Genuinely unexpected failures (not matching the branch-protection
# vocabulary) still exit 1 and fail loudly. That behaviour must not regress.
#
# Fallback behavior on 422: `gh pr merge --auto` returns 422 "Pull request
# is in clean status" when CI is ALREADY green by labeling time (the normal
# case for our adversarial-review-then-label flow, where review happens
# after CI greens).
#
# ── POST-CI RE-ATTEMPT (#142, 2026-11-06) ─────────────────────────────────
#
# Every pull_request_target event (labeled / opened / reopened) fires while CI
# has just started, so the merge below always found checks pending and took
# the graceful-block path. The `workflow_run` trigger re-attempts the merge
# once CI has COMPLETED. It is `workflow_run`, not `check_suite`, on purpose:
# GitHub does not deliver `check_suite` to workflows when the suite was
# created by GitHub Actions ("to prevent recursive workflows"), and every
# required check here is an Actions check, so that trigger would never fire.
# `workflow_run` always runs the copy of this file on the default branch.
#
# A workflow_run payload carries no reliable PR context, so the first step
# resolves the PR from the head SHA and re-derives EVERYTHING live (state,
# head SHA, labels, check-runs) rather than trusting the event. That step
# is the gate for the post-CI path; see its comments for M-1 and the
# stale-approval race. The pull_request_target path is unchanged.
#
# Security: pull_request_target has write access but does NOT check out PR
# code; only the merge call runs. Only repo collaborators can apply labels
# so a hostile PR author cannot self-label into auto-merge.

name: Auto-merge labeled PRs

on:
  pull_request_target:
    types: [labeled, synchronize, opened, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

# Serialize per-PR so a labeled run and a synchronize run cannot reorder and
# leave auto-merge armed on an un-reviewed commit. cancel-in-progress stays
# false — a drop-stale-review run must finish once it has started, even if
# a labeled run arrives after it.
# workflow_run gets its OWN group: with cancel-in-progress false a newer
# queued run still cancels an older PENDING one, and a post-CI run must never
# be able to cancel a pending drop-stale-review run for the same PR.
concurrency:
  group: auto-merge-${{ github.event_name == 'workflow_run' && format('ci-{0}', github.event.workflow_run.head_sha) || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    name: Enable auto-merge on rollback-safe + adversarial-reviewed PRs
    runs-on: ubuntu-latest
    # synchronize is excluded: new commits invalidate the review verdict, so the
    # drop-stale-review job below handles that event instead.
    # Two merge paths:
    #   STANDARD: rollback-safe + adversarial-reviewed
    #   FAST PATH: fast-path (auto-applied by auto-label-fast-path.yml)
    # Both require: NOT needs-jon-approval.
    # workflow_run: only a COMPLETED + SUCCESSFUL CI run for a same-repo
    # pull_request. Red CI, push-to-branch CI and fork PRs never start the job
    # (shown as "skipped", not failed). Labels are checked live in `resolve`.
    if: >
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || (
      github.event.action != 'synchronize' &&
      !contains(github.event.pull_request.labels.*.name, 'needs-jon-approval') &&
      (
        (
          contains(github.event.pull_request.labels.*.name, 'rollback-safe') &&
          contains(github.event.pull_request.labels.*.name, 'adversarial-reviewed')
        ) ||
        contains(github.event.pull_request.labels.*.name, 'fast-path')
      )
      )
    steps:
      - name: Resolve PR and gate (post-CI path re-checks CI, labels and freshness live)
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EV_PR: ${{ github.event.pull_request.number }}
          EV_SHA: ${{ github.event.pull_request.head.sha }}
          EV_REF: ${{ github.event.pull_request.head.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          emit() { printf 'proceed=%s\npr=%s\nsha=%s\nref=%s\n' "$1" "${2:-}" "${3:-}" "${4:-}" >> "$GITHUB_OUTPUT"; }
          skip() { echo "::notice::auto-merge (post-CI) not merging: $1"; emit false; exit 0; }

          # pull_request_target: the job `if` already applied the label gate.
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            emit true "$EV_PR" "$EV_SHA" "$EV_REF"
            exit 0
          fi

          # workflow_run has no PR context. Resolve open same-repo PRs whose
          # head IS the commit CI just ran on. Zero -> nothing to do (closed,
          # merged, or head already moved). More than one -> ambiguous, refuse;
          # each PR still gets its own attempt from its `labeled` event.
          PRS=$(gh api --paginate "repos/$REPO/commits/$RUN_SHA/pulls?per_page=100" \
            --jq ".[] | select(.state==\"open\" and .head.sha==\"$RUN_SHA\" and .head.repo.full_name==\"$REPO\") | .number")
          COUNT=$(printf '%s\n' "$PRS" | sed '/^$/d' | wc -l)
          if [ "$COUNT" -eq 0 ]; then skip "no open PR has head $RUN_SHA"; fi
          if [ "$COUNT" -gt 1 ]; then skip "$COUNT open PRs share head $RUN_SHA; ambiguous"; fi
          PR="$PRS"

          # Re-read the PR NOW. Never trust labels or SHA from the event.
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR")
          if [ "$(jq -r .state <<<"$PR_JSON")" != "open" ]; then skip "PR #$PR is not open"; fi
          if [ "$(jq -r .head.sha <<<"$PR_JSON")" != "$RUN_SHA" ]; then skip "PR #$PR head moved since CI ran"; fi

          # M-1 (AGENTS.md §11): every check-run on the head commit must be
          # completed AND green. Pending, red, cancelled, timed out, or ABSENT
          # all refuse. Allowlist, not denylist, so unknown states also refuse.
          CHECKS=$(gh api "repos/$REPO/commits/$RUN_SHA/check-runs?per_page=100")
          TOTAL=$(jq '.total_count' <<<"$CHECKS")
          SEEN=$(jq '.check_runs | length' <<<"$CHECKS")
          if [ "$TOTAL" -eq 0 ] || [ "$TOTAL" -ne "$SEEN" ]; then skip "check-runs absent or truncated ($SEEN of $TOTAL)"; fi
          BAD=$(jq -r '[.check_runs[] | select(.status != "completed" or ((.conclusion // "") | IN("success","neutral","skipped") | not)) | .name] | join(", ")' <<<"$CHECKS")
          if [ -n "$BAD" ]; then skip "M-1: checks not green: $BAD"; fi

          # Same gate as the job `if`, evaluated on live labels.
          has() { jq -e --arg l "$1" 'any(.labels[]; .name == $l)' <<<"$PR_JSON" > /dev/null; }
          if has needs-jon-approval; then skip "needs-jon-approval is set"; fi

          # Stale-approval race. drop-stale-review removes adversarial-reviewed
          # and fast-path on synchronize, but it is a separate run that could be
          # delayed past the new commit's CI. So those two labels only count if
          # they were (last) applied at or after the head commit's own date;
          # a label older than the commit approved different code. The head-SHA
          # check above and the sha pinned in the merge call cover the rest.
          # (rollback-safe is not dropped on push, so presence is enough.)
          COMMIT_AT=$(gh api "repos/$REPO/commits/$RUN_SHA" --jq .commit.committer.date)
          EVENTS=$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq '.[] | select(.event == "labeled") | "\(.label.name) \(.created_at)"')
          fresh() {
            has "$1" || return 1
            local at
            at=$(grep "^$1 " <<<"$EVENTS" | cut -d' ' -f2 | sort | tail -1 || true)
            [ -n "$at" ] && [[ ! "$at" < "$COMMIT_AT" ]]
          }
          if fresh fast-path || { has rollback-safe && fresh adversarial-reviewed; }; then
            echo "PR #$PR: CI green on $RUN_SHA and approval labels are live and fresh."
          else
            skip "PR #$PR lacks fresh fast-path or rollback-safe+adversarial-reviewed (commit $COMMIT_AT)"
          fi
          emit true "$PR" "$RUN_SHA" "$(jq -r .head.ref <<<"$PR_JSON")"

      # L2.1 — mint a short-lived GitHub App installation token.
      #
      # Why an App instead of the fine-grained BOT_TOKEN: fine-grained PATs
      # cannot use GraphQL's `mergePullRequest` mutation (cli/cli#8352,
      # cli/cli#8651), which is what made the bot unable to merge. This
      # workflow already sidesteps that by using REST, but an App token is
      # properly scoped (contents + pull_requests on this repo only), expires
      # in an hour, and is attributable to the app rather than a human.
      #
      # continue-on-error is deliberate: if APP_ID / APP_PRIVATE_KEY are not
      # set, or the mint fails for any reason, this step must NOT take the
      # merge down with it. The token selection below falls back to the
      # previous behaviour, so the worst case is "no change from today".
      # The `secrets` context is not available in step-level `if`, which is
      # why this is continue-on-error rather than a conditional.
      - name: Mint GitHub App token (optional — falls back to BOT_TOKEN)
        id: apptoken
        if: steps.resolve.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Report which credential will be used
        if: steps.resolve.outputs.proceed == 'true'
        env:
          HAVE_APP: ${{ steps.apptoken.outputs.token != '' }}
          HAVE_BOT: ${{ secrets.BOT_TOKEN != '' }}
        run: |
          # Never echo a token. Only say which source won.
          if [ "$HAVE_APP" = "true" ]; then
            echo "::notice::merging as the stem-loops-automerge GitHub App (L2.1)"
          elif [ "$HAVE_BOT" = "true" ]; then
            echo "::notice::App token unavailable — falling back to BOT_TOKEN"
          else
            echo "::notice::App token and BOT_TOKEN both unavailable — falling back to GITHUB_TOKEN"
            echo "::warning::GITHUB_TOKEN cannot merge PRs opened by other actors in some configs; if the merge below fails with a permissions error, that is why."
          fi

      - name: Enable auto-merge (squash, delete branch) — REST fallback for fine-grained PATs
        if: steps.resolve.outputs.proceed == 'true'
        env:
          # From the `resolve` step. Passed via env, not interpolated into the
          # script, because head.ref is attacker-controllable text.
          PR_NUM: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.sha }}
          HEAD_REF: ${{ steps.resolve.outputs.ref }}
          # Preference order: App installation token (L2.1) > BOT_TOKEN > GITHUB_TOKEN.
          # REST `PUT /repos/{owner}/{repo}/pulls/{N}/merge` is used rather than
          # `gh pr merge`, because the latter routes through GraphQL.
          GH_TOKEN: ${{ steps.apptoken.outputs.token || secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          echo "PR #$PR_NUM meets triple-gate; attempting REST merge against head $HEAD_SHA."

          # REST merge; -f fields auto-string-cast — pass merge_method as string.
          # Include sha so we abort if HEAD moved between label event and merge.
          HTTP_OUT=$(gh api -X PUT "repos/$REPO/pulls/$PR_NUM/merge" \
            --input - <<EOF 2>merge.err
          {"merge_method":"squash","sha":"$HEAD_SHA"}
          EOF
          ) && MERGE_OK=1 || MERGE_OK=0

          if [ "$MERGE_OK" = "1" ]; then
            echo "Merge succeeded:"
            echo "$HTTP_OUT"
            # Delete the branch (best-effort; doesn't fail the merge if delete errors)
            BRANCH="$HEAD_REF"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>branch-delete.err || \
              echo "Note: branch delete returned error (branch may already be gone):" && cat branch-delete.err || true
            exit 0
          fi

          # Merge failed — classify the reason.
          #
          # Branch-protection blocks (CODEOWNER review required, status checks
          # pending, review required, resolve-review-threads required, etc.) are
          # EXPECTED outcomes for PRs that touch CODEOWNERS paths. The reviewer
          # agent labels `adversarial-reviewed` the moment its review passes,
          # which can race the `auto-label-codeowners` workflow that adds
          # `needs-jon-approval`. When this workflow fires in that window, it
          # tries to merge and GitHub's branch protection correctly blocks it.
          #
          # That's not a workflow failure — it's the system working. Loudly
          # failing the check-run here would then block `safe_merge.sh` (which
          # refuses any PR with a FAILING check per AGENTS.md §11 M-1),
          # requiring operator intervention to merge via `gh pr merge --admin`.
          #
          # So: detect branch-protection-blocked and exit 0 with a clear log
          # line. Any other merge failure (missing permissions on BOT_TOKEN,
          # conflict, HEAD moved, 5xx, etc.) still exits 1 and surfaces to the
          # operator exactly as before.
          echo "REST merge failed. Response body:"
          cat merge.err

          # Heuristic: branch-protection responses carry 405 Method Not Allowed
          # and a message naming the specific rule. Codify the known vocabulary
          # so unknown failures still fail loudly.
          if grep -qE 'required status check|require.*(approving )?review|code owner|resolve.*review threads|Required status checks have not passed|At least [0-9]+ approving review|Review required|Changes requested' merge.err; then
            # Branch protection blocked the merge. That is the system working,
            # not a workflow fault, so this step still exits 0 — see the long
            # comment above for why failing here would wedge safe_merge.sh.
            #
            # BUT it must not be SILENT. This path used to log two ::notice::
            # lines inside a job almost nobody opens, then exit 0 — which from
            # the PR page is indistinguishable from "auto-merge succeeded".
            # A reader saw a green check and an unmerged PR with no reason.
            #
            # So: extract the rule GitHub actually named and post it as a PR
            # comment, where someone looking at a stuck PR will see it.
            # exit 78 (neutral) is not available — GitHub removed neutral exit
            # codes for `run` steps in 2019.
            # Prefer GitHub's own message field — it carries the full sentence
            # ("At least 1 approving review is required by reviewers with write
            # access."). Fall back to the keyword regex, then to a generic
            # string, so REASON is never empty.
            REASON=$(grep -oE '"message":"[^"]*"' merge.err | head -1 | sed 's/^"message":"//; s/"$//')
            if [ -z "$REASON" ]; then
              REASON=$(grep -oiE 'required status check[^"]*|at least [0-9]+ approving review[^"]*|review required|changes requested|code owner[^"]*|resolve[^"]*review threads' merge.err | head -1)
            fi
            if [ -z "$REASON" ]; then REASON="branch protection (rule not parsed from response)"; fi
            echo "::notice::auto-merge blocked by branch protection: $REASON"
            MARKER="<!-- auto-merge-blocked -->"
            printf '%s\n' "$MARKER" > body.md
            printf '%s\n\n' "**auto-merge did not merge this PR.** Branch protection blocked it:" >> body.md
            printf '> %s\n\n' "$REASON" >> body.md
            printf '%s\n' "This is expected for PRs touching CODEOWNERS paths (billing, .github/workflows/**, AGENTS.md, commercial migrations). The workflow check is green because the workflow behaved correctly — it is the merge that was refused, not the automation that failed." >> body.md
            printf '\n%s\n' "**Path forward:** run scripts/safe_merge.sh $PR_NUM with CODEOWNER approval, or merge from the GitHub UI." >> body.md
            EXISTING=$(gh api "repos/$REPO/issues/$PR_NUM/comments" --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" 2>/dev/null | head -1)
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@body.md > /dev/null && echo "Refreshed the auto-merge-blocked comment." || echo "Note: could not refresh the blocked comment (non-fatal)."
            else
              gh api -X POST "repos/$REPO/issues/$PR_NUM/comments" -F body=@body.md > /dev/null && echo "Posted an auto-merge-blocked comment." || echo "Note: could not post the blocked comment (non-fatal)."
            fi
            exit 0
          fi

          # Unknown failure — fail loudly so the operator sees it.
          exit 1

  drop-stale-review:
    name: Drop adversarial-reviewed / fast-path label on new commits (stale-approval guard)
    runs-on: ubuntu-latest
    # Any push to the PR head (including rebases and back-merges) invalidates the
    # review AND the fast-path classification (a new file outside the allowlist
    # could have landed). There is no reliable way to prove a push is content-
    # neutral, so re-review / re-classify on every synchronize is the safe default.
    # auto-label-fast-path.yml also fires on synchronize, so it will re-apply
    # fast-path on the next push if the diff still qualifies.
    if: >
      github.event.action == 'synchronize' &&
      (
        contains(github.event.pull_request.labels.*.name, 'adversarial-reviewed') ||
        contains(github.event.pull_request.labels.*.name, 'fast-path')
      )
    steps:
      - name: Disable any pending auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Check first, then disable: the previous `|| echo ...` swallowed real
        # errors (403, GraphQL, network) and let the label-removal step run
        # with auto-merge still armed — the exact hole this guard is meant to
        # close. If disable fails for a real reason, fail the job loudly.
        run: |
          set -euo pipefail
          armed=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$armed" = "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto
          else
            echo "auto-merge was not armed; nothing to disable."
          fi

      - name: Remove labels and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            // Try to remove both labels; fast-path and adversarial-reviewed
            // are mutually substitutable but either can be the live one.
            const toRemove = ['adversarial-reviewed', 'fast-path'];
            const removed = [];
            for (const name of toRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                removed.push(name);
              } catch (e) {
                if (e.status !== 404) throw e; // 404 = wasn't applied; fine.
              }
            }
            if (removed.length === 0) {
              core.info('No stale approval labels present; skipping comment.');
              return;
            }
            const label_phrase = removed.map(n => '`' + n + '`').join(' and ');
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `Re-review / re-classify required: new commits since approval. Removed ${label_phrase}. auto-label-fast-path.yml will re-apply fast-path on this synchronize if the diff still qualifies.`,
            });
