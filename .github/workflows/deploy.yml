name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - worker

jobs:
  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'all' || inputs.target == 'web' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Deploy to Vercel
        run: cd apps/web && npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-worker:
    name: Deploy Worker to Fly.io
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'all' || inputs.target == 'worker' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be  # 1.5
      - name: Deploy to Fly.io
        # --ha=false: this app must stay at ONE Machine (FOR UPDATE SKIP LOCKED makes
        # two safe, but min_machines_running is a floor and HA would add a second).
        #
        # The binary is `flyctl`, NOT `fly`. setup-flyctl installs it as `flyctl`;
        # `fly` is a convenience alias that exists in some local installs and does
        # NOT exist on the runner. The workflow's first and only run died here with
        # `fly: command not found` (exit 127) -- diagnosed 2026-11-10 against Fly's
        # own CI guide, which uses `flyctl deploy`.
        #
        # --remote-only builds on Fly's builders instead of the runner, which is what
        # Fly's guide recommends for CI and removes any dependency on the runner's
        # Docker/buildx setup.
        run: cd apps/worker && flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
