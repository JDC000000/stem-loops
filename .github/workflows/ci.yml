name: CI

on:
  push:
    branches: [main, v3/main]
  pull_request:
    branches: [main, v3/main]

jobs:
  types-drift:
    name: Types drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install 'pydantic>=2.7.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4  # version from package.json packageManager
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
        working-directory: packages/types
      - name: Regenerate types
        run: cd packages/types && python scripts/codegen.py
      - name: Check for type drift
        run: |
          if ! git diff --exit-code packages/types/src/; then
            echo "TYPE DRIFT DETECTED: run 'make types-generate' and commit the result"
            git diff packages/types/src/
            exit 1
          fi

  alphabet-drift:
    name: Alphabet drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate alphabet
        run: python packages/types/scripts/codegen_alphabet.py
      - name: Check for alphabet drift
        run: |
          GENERATED="apps/web/src/chord/alphabet.ts apps/web/src/chord/__tests__/fixtures/alphabet-parity.json"
          if ! git diff --exit-code $GENERATED; then
            echo "ALPHABET DRIFT DETECTED: run 'make alphabet-generate' and commit the result"
            git diff $GENERATED
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        # Pinned via the prod constraints so a new ruff/black release can't turn main red.
        run: pip install ruff black -c apps/worker/constraints-prod.txt
      - name: CODEOWNERS path set agrees across its three copies
        # The set of paths needing Jon's approval is written down three times:
        # .github/CODEOWNERS, auto-label-codeowners.yml (applies the label) and
        # auto-merge.yml's CO_RE (computes the verdict inline so a merge cannot
        # win a race against the labeller — PR #174 merged 36s before its label
        # arrived). A third copy with no gate on it would trade one silent
        # failure for another, so this is wired into Lint, which is a REQUIRED
        # context. A gate that is not in CI is a documented-but-inert control,
        # and this repo has been bitten by several.
        # Exit codes: 0 ok · 1 drift · 2 attempted-and-failed · 3 not-attempted.
        run: python scripts/check_codeowners_drift.py
      - name: ruff check
        run: cd apps/worker && python -m ruff check src/ tests/
      - name: black check
        run: cd apps/worker && python -m black --check src/ tests/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4  # version from package.json packageManager
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm --filter web lint
      - name: Web typecheck (tsc --noEmit)
        # Added PR-Y1.sec-T1: the absence of a tsc gate is how the ChordOverlay
        # broken-import bug reached v3/main (y1-test-coverage-audit.md T1).
        # Catches any import that doesn't resolve, missing export, or type
        # mismatch before a PR can land.
        run: pnpm --filter web typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Bounded, because a hung test is otherwise a 6-hour runner (the default) rather than a
    # red check: this job has no pytest-timeout. The real-R2 tests start an in-process S3
    # server, and a server that cannot bind used to wait for ever. The suite takes about two
    # minutes of pytest locally; 30 leaves room for installs and a slow runner.
    timeout-minutes: 30
    # Postgres so the DB-backed tests (retention sweep, migration 007, consumer) actually
    # run instead of skipping for lack of DATABASE_URL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stemloops
          POSTGRES_PASSWORD: stemloops
          POSTGRES_DB: stemloops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        # requirements-dev.txt holds moto, which tests/real_r2.py needs (not in the prod image).
        run: pip install -r apps/worker/requirements.txt -r apps/worker/requirements-dev.txt -c apps/worker/constraints-prod.txt
      - name: Apply migrations (001-007)
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate
      - name: pytest
        run: cd apps/worker && python -m pytest tests/ -v
        env:
          STUB_MODE: "true"
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_ENDPOINT: http://localhost:9000
          R2_BUCKET_NAME: test-bucket
      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # web unit tests use node's built-in TypeScript stripping (>= 22.6)
      - uses: pnpm/action-setup@v4  # version from package.json packageManager
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Web unit tests
        run: pnpm --filter web test
      - name: Node tests
        run: pnpm test

  fixture-pipeline:
    name: Fixture pipeline (stub)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stemloops
          POSTGRES_PASSWORD: stemloops
          POSTGRES_DB: stemloops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      minio:
        # minio/minio was removed from Docker Hub (pull access denied) and quay.io now
        # requires auth. Bitnami's frozen legacy image starts the server from its
        # entrypoint (service containers can't pass `server /data`) and ships curl.
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
    env:
      STUB_MODE: "true"
      DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_ENDPOINT_URL: http://localhost:9000  # what r2_uploader reads (not R2_ENDPOINT)
      R2_BUCKET_NAME: stem-loops-ci
      IP_HASH_KEY: ci-test-key
      HISTORY_COOKIE_KEY: ci-cookie-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r apps/worker/requirements.txt -c apps/worker/constraints-prod.txt
      - name: Create MinIO bucket
        # boto3 is already installed (pinned); `pip install awscli` would re-resolve botocore.
        run: |
          python -c "import os, boto3; boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT_URL'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'], region_name='us-east-1').create_bucket(Bucket=os.environ['R2_BUCKET_NAME'])"
      - name: Run migrations
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate
      - name: Run fixture pipeline (stub mode)
        run: |
          cd apps/worker && PYTHONPATH=src python -m worker.cli test-job "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      - name: Assert stub job finished and uploaded loops
        run: |
          cd apps/worker && python - <<'PY'
          import os, boto3, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              status, loops = c.execute(
                  "SELECT status, (SELECT count(*) FROM loops l WHERE l.job_id = j.id)"
                  " FROM jobs j ORDER BY created_at DESC LIMIT 1").fetchone()
          objs = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                              region_name="us-east-1").list_objects_v2(
              Bucket=os.environ["R2_BUCKET_NAME"]).get("KeyCount", 0)
          print(f"status={status} loops={loops} objects={objs}")
          assert status == "done" and loops > 0 and objs > 0
          PY
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
      - name: Fixture pipeline test (Postgres + MinIO)
        run: cd apps/worker && python -m pytest tests/test_pipeline_fixtures.py -v

  rls-gate:
    name: "RLS gate (SL-B26 #1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert RLS + policy on every migration table
        run: python scripts/check_rls.py apps/worker/migrations/

  python-syntax-and-markers:
    # R-2 (session 6 retrospective v2): CI gates every language that ships.
    # Started as PR-Y1.sec-F1 regression guard for apps/training/ only.
    # Session 7 widens to:
    #   - compileall across every Python package (apps/worker, apps/training,
    #     scripts, packages/types)
    #   - merge-conflict marker grep repo-wide for canonical 7-wide markers
    #     on text files (false-positive-free per 2026-11-05 audit)
    # compileall is cheap (syntax-only, no imports) so no training dep install
    # needed on this job.
    name: "Python syntax (compileall) + repo-wide merge markers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge-conflict marker grep (repo-wide, canonical 7-wide)
        # Canonical markers only to avoid false-positives:
        #   ^<<<<<<< <ref>   — conflict begin
        #   ^=======$        — exact-match divider line
        #   ^>>>>>>> <ref>   — conflict end
        # --exclude-dir keeps node_modules / build outputs / git itself out.
        run: |
          if grep -rE '^(<<<<<<< |=======$|>>>>>>> )' \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=.next \
              --exclude-dir=dist \
              --exclude-dir=build \
              --exclude-dir=.turbo \
              .; then
            echo "Unresolved merge markers found. Resolve and re-push."
            exit 1
          fi
      - name: compileall apps/worker
        run: python -m compileall apps/worker/src
      - name: compileall apps/training
        run: python -m compileall apps/training
      - name: compileall scripts
        # scripts/ holds standalone tools; syntax must at least parse.
        run: python -m compileall scripts
      - name: compileall packages/types
        # packages/types has python codegen; compileall its py files.
        run: |
          if [ -d packages/types/scripts ]; then
            python -m compileall packages/types/scripts
          fi

  training-tests:
    # R-2 (session 6 retrospective v2): apps/training/tests/ was never executed in CI.
    #
    # Path filtering: an in-job `git diff` gate, NOT a workflow-level `paths:` key
    # and NOT dorny/paths-filter.
    #   - A workflow-level `paths:` filter would stop the whole workflow from
    #     triggering, which would leave a required check "Expected - waiting"
    #     forever on PRs that don't touch training. Unsafe for required checks.
    #   - A job-level `if:` (or dorny/paths-filter + `needs` + `if:`) yields a
    #     *skipped* job, which GitHub counts as passing for required checks, but
    #     dorny adds a third-party action and an extra job for a one-line check.
    #   - The in-job gate keeps the job always running and always reporting a
    #     real success/failure; heavy steps are simply skipped when irrelevant
    #     (a no-op run costs ~10s). Safe to mark as a required check.
    # Runs on every push (main / v3/main) and on PRs touching apps/training/** or
    # this workflow file (so edits to this job are self-validated).
    name: "Training tests (pytest, CPU torch)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # PR checkout is a merge commit; HEAD^1 is the base
      - name: Decide whether training tests are relevant
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Push build: always run."
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/training/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No training changes; skipping heavy steps."
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          # No requirements.txt in apps/training; key the pip cache on pyproject.
          cache-dependency-path: apps/training/pyproject.toml
      - name: Install CPU-only torch
        # Default PyPI torch pulls ~2GB of CUDA wheels; the CPU index is a few hundred MB.
        # Installed first so the later `torch>=2.3.0` requirement is already satisfied.
        if: steps.gate.outputs.run == 'true'
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install training deps
        # Read deps from pyproject (single source of truth). Not `pip install -e`:
        # apps/training is a flat layout with several top-level dirs, which
        # setuptools auto-discovery rejects. conftest.py puts apps/ on sys.path.
        # No fluidsynth apt package: synthetic_render imports pyFluidSynth lazily
        # and the tests patch render_midi_to_wav, so nothing needs libfluidsynth.
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY' > "$RUNNER_TEMP/training-reqs.txt"
          import tomllib
          p = tomllib.load(open("apps/training/pyproject.toml", "rb"))["project"]
          print("\n".join(p["dependencies"] + p["optional-dependencies"]["dev"]))
          PY
          pip install -r "$RUNNER_TEMP/training-reqs.txt"
      - name: pytest (apps/training)
        # All tests are hermetic (httpx patched, rendering faked, no data files).
        # onnx/onnxruntime/onnxscript are in pyproject's dev extras ON PURPOSE:
        # test_export_onnx.py importorskip()s the whole file without them, which
        # would make this job report green while the ONNX export path has zero
        # coverage. If you trim those deps to speed the job up, you are deleting
        # that coverage silently — skipped is not passed.
        if: steps.gate.outputs.run == 'true'
        run: cd apps/training && python -m pytest tests/ -v

  check-tsd-refs:
    name: "TSD §N.M refs resolve (Fleet Playbook Move 4)"
    # PR-only: we read the PR body via the GitHub API, so push builds have
    # nothing to validate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Blocking as of session 7 (2026-11-05): noise-tuning period ended clean,
    # TSD-ref typos now fail PRs. See claude/session-7-handover.md §6.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate every TSD §N.M reference resolves to a heading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q .body \
            | python3 scripts/check_tsd_refs.py

  credit-pack-price-recon:
    name: "Credit pack price recon (audit M5)"
    runs-on: ubuntu-latest
    # Repo secrets are unavailable to fork PRs; skip rather than fail there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # THE ONE POLICY SWITCH for this job. Owner decision (Jon).
      #
      # The script exits 3 ("NOT CHECKED") when STRIPE_SECRET_KEY or any
      # STRIPE_PRICE_CREDITS_* secret is unset/empty: nothing was compared.
      #   "0" (default) -> exit 3 fails the job. An unconfigured gate is RED, so
      #                    a green tick always means prices were actually compared.
      #                    CAUTION: if those repo secrets are not set, this is red
      #                    on every PR until they are added.
      #   "1"           -> exit 3 (and ONLY exit 3) becomes a ::warning:: and the
      #                    job passes. Prices were NOT checked; the warning says so.
      #                    It never forgives exit 1 (drift) or exit 2 (broken
      #                    seed, or Stripe/DB lookup failure).
      # Flip to "1" only to knowingly run unguarded until the secrets exist.
      RECON_ALLOW_UNCONFIGURED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install stripe psycopg[binary]
      - name: Reconcile credit_packs prices with Stripe unit_amount
        # Default `--source auto` catches the actual M5 scenario (live DB
        # price edits drifting from Stripe) when DATABASE_URL_CREDIT_PACKS_RO
        # is wired as a repo secret. Falls back to migration 020 seed when
        # the env var is absent. Exit codes: see the script docstring and the
        # RECON_ALLOW_UNCONFIGURED switch above (only exit 3 is ever forgiven).
        run: |
          rc=0
          python scripts/check_credit_pack_prices.py || rc=$?
          if [ "$rc" -eq 3 ] && [ "$RECON_ALLOW_UNCONFIGURED" = "1" ]; then
            echo "::warning title=Credit pack price recon NOT RUN::Stripe secrets are not configured; no prices were compared (RECON_ALLOW_UNCONFIGURED=1)."
            exit 0
          fi
          exit "$rc"
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_CREDITS_20: ${{ secrets.STRIPE_PRICE_CREDITS_20 }}
          STRIPE_PRICE_CREDITS_60: ${{ secrets.STRIPE_PRICE_CREDITS_60 }}
          STRIPE_PRICE_CREDITS_180: ${{ secrets.STRIPE_PRICE_CREDITS_180 }}
          # DATABASE_URL is deliberately NOT mapped here yet. Read before
          # adding it back -- two preconditions and one gotcha.
          #
          # Mapping a secret that does not exist sets the variable to the EMPTY
          # STRING, not to nothing. The script treats that as a
          # misconfiguration and exits 2, because the alternative -- quietly
          # comparing the migration seed while this job's name says it
          # reconciled the live table -- is a green tick over an unchecked M5
          # scenario, reachable by a rename or a rotation. With no mapping at
          # all the variable is genuinely unset, the seed path is taken
          # honestly, and the output says `Expected source: migration 020 seed`.
          #
          # To turn on live DB-vs-Stripe checking, map
          # secrets.DATABASE_URL_CREDIT_PACKS_RO to DATABASE_URL here, once
          # BOTH of these hold:
          #   1. the secret exists, and
          #   2. migration 020 has been applied to the database it points at.
          #      Production was on 008 as of 2026-11-06 and `credit_packs`
          #      arrives in 020, so wiring this before the cutover makes every
          #      PR red with `relation "public.credit_packs" does not exist`.
          #
          # The gotcha: a role with SELECT on credit_packs only still returns
          # ZERO ROWS under 020's RLS, whose policies cover anon/authenticated,
          # stemloops_app and cowork_ro. Fail-closed, but the error reads
          # `packs missing from credit_packs table`, which points at the table
          # contents rather than at RLS. Grant the role one of those roles, or
          # add a policy for it.

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    # Added 2026-11-05 as a PRECONDITION for widening fast-path auto-merge to
    # apps/web/src/ (L2.3). Before this job, NO CI job built apps/web:
    # `Lint` runs eslint, `Types drift check` runs tsc --noEmit, `Tests` runs
    # unit tests. None of them runs `next build`.
    #
    # Vercel does build, but it reports as a commit STATUS ("Vercel"), not a
    # check-run — so scripts/safe_merge.sh (which reads /commits/{sha}/check-runs)
    # never sees it, and it was not among the ruleset's required contexts.
    # A PR that broke the production build could therefore merge green.
    #
    # Vercel's status was NOT simply added as a required context instead,
    # because a skipped Vercel deploy would never report and would then block
    # the branch permanently — the same failure mode as the truncated
    # "RLS gate (SL-B26" context this repo just fixed. This job always runs
    # and always reports.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: next build
        run: pnpm --filter web build
        env:
          # Build-time only. The app reads real values at runtime from Vercel;
          # these exist so `next build` can statically evaluate the modules
          # that reference them without a secret being present in CI.
          NEXT_TELEMETRY_DISABLED: "1"


  supabase-prelude-migrations:
    name: Migrations on a Supabase-like Postgres
    runs-on: ubuntu-latest
    # AGENTS.md §11 M-3 asked for this job by name.
    #
    # Every other migration step in this file runs as a SUPERUSER against bare
    # Postgres. A superuser bypasses privilege checks, and bare Postgres has no
    # `auth` schema at all, so an entire class of Supabase-only failure is
    # invisible to CI. Migration 012 is the proof: `42501 permission denied for
    # schema auth` on Supabase, green here, found only by rehearsing against a
    # real project on the day of the production cutover.
    #
    # This job runs the real runner over every real migration as a role shaped
    # like Supabase's `postgres`: NOSUPERUSER, owns the database, no CREATE on
    # `auth`.
    #
    # Image is postgres:16 for consistency with the other jobs in this file;
    # the calibration project is PG 17.11. Nothing this job exercises differs
    # between 16 and 17, but if that stops being true, calibrate against 17.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r apps/worker/requirements.txt -c apps/worker/constraints-prod.txt

      - name: Apply the Supabase-like prelude (as superuser)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f apps/worker/tests/fixtures/supabase_prelude.sql

      # Without this the job could pass while testing nothing: grant CREATE on
      # `auth` by accident and every migration sails through exactly as it does
      # on bare Postgres — a green tick over a gate that quietly stopped being a
      # gate. That is this project's house bug, so the gate pins its own
      # preconditions. This list must stay identical to the CALIBRATION block in
      # the prelude. Values read from a live Supabase project 2026-11-06.
      - name: Assert the prelude still reproduces Supabase
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          fail=0
          check() {
            got=$(psql -h localhost -U postgres -d postgres -tAc "$2")
            if [ "$got" != "$3" ]; then
              echo "::error::prelude drift: $1 is '$got', expected '$3'"
              fail=1
            else
              echo "  ok  $1 = $got"
            fi
          }
          check "create_on_database" "SELECT has_database_privilege('migrator',current_database(),'CREATE')" "t"
          check "create_on_auth"     "SELECT has_schema_privilege('migrator','auth','CREATE')"               "f"
          check "usage_on_auth"      "SELECT has_schema_privilege('migrator','auth','USAGE')"                "t"
          check "select_auth_users"  "SELECT has_table_privilege('migrator','auth.users','SELECT')"           "t"
          check "trigger_auth_users" "SELECT has_table_privilege('migrator','auth.users','TRIGGER')"          "t"
          check "is_superuser"       "SELECT rolsuper FROM pg_roles WHERE rolname='migrator'"                 "f"
          check "bypassrls"          "SELECT rolbypassrls FROM pg_roles WHERE rolname='migrator'"             "t"
          check "createrole"         "SELECT rolcreaterole FROM pg_roles WHERE rolname='migrator'"            "t"
          check "database_owner"     "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname=current_database()" "migrator"
          check "public_owner"       "SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname='public'"        "pg_database_owner"
          exit $fail

      - name: Run every migration as the restricted role
        env:
          DATABASE_URL: postgresql://migrator:migrator@localhost:5432/postgres
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate

      - name: Assert the whole chain landed, and that grants were not silent no-ops
        env:
          PGPASSWORD: migrator
        run: |
          set -euo pipefail
          q() { psql -h localhost -U migrator -d postgres -tAc "$1"; }
          # `find -maxdepth 1` rather than `ls *.sql`: ls would expand a
          # DIRECTORY named *.sql into its contents and miscount. This mirrors
          # the runner's top-level-only glob.
          expected=$(find apps/worker/migrations -maxdepth 1 -name '*.sql' -type f | wc -l | tr -d ' ')
          actual=$(q "SELECT count(*) FROM public._migrations")
          echo "repo migrations: $expected   ledger rows: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::ledger holds $actual rows but the repo has $expected migrations"
            exit 1
          fi
          # Migration 011 grants stemloops_app USAGE on public. Under an earlier
          # prelude that executed as `WARNING: no privileges were granted` and
          # psycopg swallowed it — green chain, wrong ACL. Assert the explicit
          # grantee entry, not has_schema_privilege, which is also true via the
          # PUBLIC pseudo-role and so cannot distinguish the two.
          acl=$(q "SELECT COALESCE(nspacl::text,'') FROM pg_namespace WHERE nspname='public'")
          echo "public acl: $acl"
          case "$acl" in
            *stemloops_app=U*) echo "  ok  011's grant took effect" ;;
            *) echo "::error::011's GRANT USAGE ON SCHEMA public TO stemloops_app did not take effect — likely a silent no-op"; exit 1 ;;
          esac

      - name: Re-run to prove idempotency
        env:
          DATABASE_URL: postgresql://migrator:migrator@localhost:5432/postgres
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate

      # Smoke-runs the code-to-schema drift gate from the sibling PR.
      #
      # BE CLEAR ABOUT WHAT THIS DOES NOT DO. It checks a ledger this job just
      # populated itself, from this same checkout, so it can never report
      # drift. It proves the gate executes and reads a real ledger; it does not
      # protect production. As of 2026-11-06 prod's `_migrations` holds 8 rows
      # against 30 in the repo and nothing here turns red over it. Closing that
      # needs a read-only ledger credential as a secret (house pattern:
      # `DATABASE_URL_CREDIT_PACKS_RO`) or a deploy-time hook. Tracked; not
      # done.
      #
      # The conditional ships WITH its condition (L25): this ref does not
      # contain the script, so the step skips today and starts running by
      # itself once the gate merges, with no coordination.
      - name: Run the code-to-schema drift gate against the migrated database
        if: hashFiles('scripts/check_migration_drift.py') != ''
        env:
          DATABASE_URL: postgresql://migrator:migrator@localhost:5432/postgres
        run: python scripts/check_migration_drift.py

      # A step that silently skips forever is exactly this project's house bug,
      # so the skip is made loud. When the warning stops appearing, the guard
      # above has served its purpose and can be deleted.
      - name: Say plainly whether the drift gate ran
        run: |
          if [ -f scripts/check_migration_drift.py ]; then
            echo "drift gate present and executed in the previous step"
          else
            echo "::warning::scripts/check_migration_drift.py is not on this ref, so the drift gate step above was SKIPPED. Once that PR has merged, this warning disappears and the hashFiles guard can be removed."
          fi
