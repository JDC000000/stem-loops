[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stem-loops-training"
version = "0.3.0"
description = "ChordNet training pipeline for stem-loops V3 (Y1 clean-recipe)"
requires-python = ">=3.11"
dependencies = [
    # Core deep learning
    "torch>=2.1",
    "torchaudio>=2.1",
    # Audio / DSP
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    # Chord-eval and MIR utilities
    "mir_eval>=0.7",
    # MIDI + synthetic rendering (PR-Y1.3)
    "pretty_midi>=0.2.10",
    "pyFluidSynth>=1.3.3",
    # Data download + manifest
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    # ONNX int8 export + runtime verification (PR-Y1.5b)
    "onnx>=1.15",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]
# PR-Y1.4 optional: weights & biases run tracking.
wandb = [
    "wandb>=0.17.0",
]

# Mirrors apps/worker/pyproject.toml so the two Python packages lint the
# same way. Ruff's I ruleset handles import sorting (no isort).
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
