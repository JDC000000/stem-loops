# Auto-enable auto-merge on PRs that are gated. Two paths:
#   STANDARD (R-3 review path):
#     * rollback-safe        — reversible by git revert
#     * adversarial-reviewed — 3-lens review passed
#     * NOT needs-jon-approval — Jon still eyes money/prod-touching code
#   FAST PATH (T2 auto-merge, 2026-11-05):
#     * fast-path            — auto-applied by .github/workflows/auto-label-fast-path.yml
#                              when the entire diff is docs/tests/generated-types
#     * NOT needs-jon-approval — hard stop regardless
# When conditions hold, fires `gh pr merge --auto`; GitHub's required status
# checks still gate the actual merge.
#
# Fallback behavior: `gh pr merge --auto` returns 422 "Pull request is in
# clean status" when CI is ALREADY green by labeling time (the normal case
# for our adversarial-review-then-label flow, where review happens after
# CI greens). The merge step catches that 422 and falls through to a
# direct `gh pr merge --squash --delete-branch`. Any other error surfaces.
#
# Security: pull_request_target has write access but does NOT check out PR
# code; only the merge call runs. Only repo collaborators can apply labels
# so a hostile PR author cannot self-label into auto-merge.

name: Auto-merge labeled PRs

on:
  pull_request_target:
    types: [labeled, synchronize, opened, reopened]

permissions:
  contents: write
  pull-requests: write

# Serialize per-PR so a labeled run and a synchronize run cannot reorder and
# leave auto-merge armed on an un-reviewed commit. cancel-in-progress stays
# false — a drop-stale-review run must finish once it has started, even if
# a labeled run arrives after it.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    name: Enable auto-merge on rollback-safe + adversarial-reviewed PRs
    runs-on: ubuntu-latest
    # synchronize is excluded: new commits invalidate the review verdict, so the
    # drop-stale-review job below handles that event instead.
    # Two merge paths:
    #   STANDARD: rollback-safe + adversarial-reviewed
    #   FAST PATH: fast-path (auto-applied by auto-label-fast-path.yml)
    # Both require: NOT needs-jon-approval.
    if: >
      github.event.action != 'synchronize' &&
      !contains(github.event.pull_request.labels.*.name, 'needs-jon-approval') &&
      (
        (
          contains(github.event.pull_request.labels.*.name, 'rollback-safe') &&
          contains(github.event.pull_request.labels.*.name, 'adversarial-reviewed')
        ) ||
        contains(github.event.pull_request.labels.*.name, 'fast-path')
      )
    steps:
      # L2.1 — mint a short-lived GitHub App installation token.
      #
      # Why an App instead of the fine-grained BOT_TOKEN: fine-grained PATs
      # cannot use GraphQL's `mergePullRequest` mutation (cli/cli#8352,
      # cli/cli#8651), which is what made the bot unable to merge. This
      # workflow already sidesteps that by using REST, but an App token is
      # properly scoped (contents + pull_requests on this repo only), expires
      # in an hour, and is attributable to the app rather than a human.
      #
      # continue-on-error is deliberate: if APP_ID / APP_PRIVATE_KEY are not
      # set, or the mint fails for any reason, this step must NOT take the
      # merge down with it. The token selection below falls back to the
      # previous behaviour, so the worst case is "no change from today".
      # The `secrets` context is not available in step-level `if`, which is
      # why this is continue-on-error rather than a conditional.
      - name: Mint GitHub App token (optional — falls back to BOT_TOKEN)
        id: apptoken
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Report which credential will be used
        env:
          HAVE_APP: ${{ steps.apptoken.outputs.token != '' }}
          HAVE_BOT: ${{ secrets.BOT_TOKEN != '' }}
        run: |
          # Never echo a token. Only say which source won.
          if [ "$HAVE_APP" = "true" ]; then
            echo "::notice::merging as the stem-loops-automerge GitHub App (L2.1)"
          elif [ "$HAVE_BOT" = "true" ]; then
            echo "::notice::App token unavailable — falling back to BOT_TOKEN"
          else
            echo "::notice::App token and BOT_TOKEN both unavailable — falling back to GITHUB_TOKEN"
            echo "::warning::GITHUB_TOKEN cannot merge PRs opened by other actors in some configs; if the merge below fails with a permissions error, that is why."
          fi

      - name: Enable auto-merge (squash, delete branch) — REST fallback for fine-grained PATs
        env:
          # Preference order: App installation token (L2.1) > BOT_TOKEN > GITHUB_TOKEN.
          # REST `PUT /repos/{owner}/{repo}/pulls/{N}/merge` is used rather than
          # `gh pr merge`, because the latter routes through GraphQL.
          GH_TOKEN: ${{ steps.apptoken.outputs.token || secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "PR #$PR_NUM meets triple-gate; attempting REST merge against head $HEAD_SHA."

          # REST merge; -f fields auto-string-cast — pass merge_method as string.
          # Include sha so we abort if HEAD moved between label event and merge.
          HTTP_OUT=$(gh api -X PUT "repos/$REPO/pulls/$PR_NUM/merge" \
            --input - <<EOF 2>merge.err
          {"merge_method":"squash","sha":"$HEAD_SHA"}
          EOF
          ) && MERGE_OK=1 || MERGE_OK=0

          if [ "$MERGE_OK" = "1" ]; then
            echo "Merge succeeded:"
            echo "$HTTP_OUT"
            # Delete the branch (best-effort; doesn't fail the merge if delete errors)
            BRANCH="${{ github.event.pull_request.head.ref }}"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>branch-delete.err || \
              echo "Note: branch delete returned error (branch may already be gone):" && cat branch-delete.err || true
            exit 0
          fi

          # Merge failed — classify the reason.
          #
          # Branch-protection blocks (CODEOWNER review required, status checks
          # pending, review required, resolve-review-threads required, etc.) are
          # EXPECTED outcomes for PRs that touch CODEOWNERS paths. The reviewer
          # agent labels `adversarial-reviewed` the moment its review passes,
          # which can race the `auto-label-codeowners` workflow that adds
          # `needs-jon-approval`. When this workflow fires in that window, it
          # tries to merge and GitHub's branch protection correctly blocks it.
          #
          # That's not a workflow failure — it's the system working. Loudly
          # failing the check-run here would then block `safe_merge.sh` (which
          # refuses any PR with a FAILING check per AGENTS.md §11 M-1),
          # requiring operator intervention to merge via `gh pr merge --admin`.
          #
          # So: detect branch-protection-blocked and exit 0 with a clear log
          # line. Any other merge failure (missing permissions on BOT_TOKEN,
          # conflict, HEAD moved, 5xx, etc.) still exits 1 and surfaces to the
          # operator exactly as before.
          echo "REST merge failed. Response body:"
          cat merge.err

          # Heuristic: branch-protection responses carry 405 Method Not Allowed
          # and a message naming the specific rule. Codify the known vocabulary
          # so unknown failures still fail loudly.
          if grep -qE 'required status check|require.*(approving )?review|code owner|resolve.*review threads|Required status checks have not passed|At least [0-9]+ approving review|Review required|Changes requested' merge.err; then
            # Branch protection blocked the merge. That is the system working,
            # not a workflow fault, so this step still exits 0 — see the long
            # comment above for why failing here would wedge safe_merge.sh.
            #
            # BUT it must not be SILENT. This path used to log two ::notice::
            # lines inside a job almost nobody opens, then exit 0 — which from
            # the PR page is indistinguishable from "auto-merge succeeded".
            # A reader saw a green check and an unmerged PR with no reason.
            #
            # So: extract the rule GitHub actually named and post it as a PR
            # comment, where someone looking at a stuck PR will see it.
            # exit 78 (neutral) is not available — GitHub removed neutral exit
            # codes for `run` steps in 2019.
            # Prefer GitHub's own message field — it carries the full sentence
            # ("At least 1 approving review is required by reviewers with write
            # access."). Fall back to the keyword regex, then to a generic
            # string, so REASON is never empty.
            REASON=$(grep -oE '"message":"[^"]*"' merge.err | head -1 | sed 's/^"message":"//; s/"$//')
            if [ -z "$REASON" ]; then
              REASON=$(grep -oiE 'required status check[^"]*|at least [0-9]+ approving review[^"]*|review required|changes requested|code owner[^"]*|resolve[^"]*review threads' merge.err | head -1)
            fi
            if [ -z "$REASON" ]; then REASON="branch protection (rule not parsed from response)"; fi
            echo "::notice::auto-merge blocked by branch protection: $REASON"
            MARKER="<!-- auto-merge-blocked -->"
            printf '%s\n' "$MARKER" > body.md
            printf '%s\n\n' "**auto-merge did not merge this PR.** Branch protection blocked it:" >> body.md
            printf '> %s\n\n' "$REASON" >> body.md
            printf '%s\n' "This is expected for PRs touching CODEOWNERS paths (billing, .github/workflows/**, AGENTS.md, commercial migrations). The workflow check is green because the workflow behaved correctly — it is the merge that was refused, not the automation that failed." >> body.md
            printf '\n%s\n' "**Path forward:** run scripts/safe_merge.sh $PR_NUM with CODEOWNER approval, or merge from the GitHub UI." >> body.md
            EXISTING=$(gh api "repos/$REPO/issues/$PR_NUM/comments" --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" 2>/dev/null | head -1)
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@body.md > /dev/null && echo "Refreshed the auto-merge-blocked comment." || echo "Note: could not refresh the blocked comment (non-fatal)."
            else
              gh api -X POST "repos/$REPO/issues/$PR_NUM/comments" -F body=@body.md > /dev/null && echo "Posted an auto-merge-blocked comment." || echo "Note: could not post the blocked comment (non-fatal)."
            fi
            exit 0
          fi

          # Unknown failure — fail loudly so the operator sees it.
          exit 1

  drop-stale-review:
    name: Drop adversarial-reviewed / fast-path label on new commits (stale-approval guard)
    runs-on: ubuntu-latest
    # Any push to the PR head (including rebases and back-merges) invalidates the
    # review AND the fast-path classification (a new file outside the allowlist
    # could have landed). There is no reliable way to prove a push is content-
    # neutral, so re-review / re-classify on every synchronize is the safe default.
    # auto-label-fast-path.yml also fires on synchronize, so it will re-apply
    # fast-path on the next push if the diff still qualifies.
    if: >
      github.event.action == 'synchronize' &&
      (
        contains(github.event.pull_request.labels.*.name, 'adversarial-reviewed') ||
        contains(github.event.pull_request.labels.*.name, 'fast-path')
      )
    steps:
      - name: Disable any pending auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Check first, then disable: the previous `|| echo ...` swallowed real
        # errors (403, GraphQL, network) and let the label-removal step run
        # with auto-merge still armed — the exact hole this guard is meant to
        # close. If disable fails for a real reason, fail the job loudly.
        run: |
          set -euo pipefail
          armed=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$armed" = "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto
          else
            echo "auto-merge was not armed; nothing to disable."
          fi

      - name: Remove labels and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            // Try to remove both labels; fast-path and adversarial-reviewed
            // are mutually substitutable but either can be the live one.
            const toRemove = ['adversarial-reviewed', 'fast-path'];
            const removed = [];
            for (const name of toRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                removed.push(name);
              } catch (e) {
                if (e.status !== 404) throw e; // 404 = wasn't applied; fine.
              }
            }
            if (removed.length === 0) {
              core.info('No stale approval labels present; skipping comment.');
              return;
            }
            const label_phrase = removed.map(n => '`' + n + '`').join(' and ');
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `Re-review / re-classify required: new commits since approval. Removed ${label_phrase}. auto-label-fast-path.yml will re-apply fast-path on this synchronize if the diff still qualifies.`,
            });
