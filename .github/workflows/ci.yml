name: CI

on:
  push:
    branches: [main, v3/main]
  pull_request:
    branches: [main, v3/main]

jobs:
  types-drift:
    name: Types drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install 'pydantic>=2.7.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 -- version from package.json packageManager
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
        working-directory: packages/types
      - name: Regenerate types
        run: cd packages/types && python scripts/codegen.py
      - name: Check for type drift
        run: |
          if ! git diff --exit-code packages/types/src/; then
            echo "TYPE DRIFT DETECTED: run 'make types-generate' and commit the result"
            git diff packages/types/src/
            exit 1
          fi

  alphabet-drift:
    name: Alphabet drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Regenerate alphabet
        run: python packages/types/scripts/codegen_alphabet.py
      - name: Check for alphabet drift
        run: |
          GENERATED="apps/web/src/chord/alphabet.ts apps/web/src/chord/__tests__/fixtures/alphabet-parity.json"
          if ! git diff --exit-code $GENERATED; then
            echo "ALPHABET DRIFT DETECTED: run 'make alphabet-generate' and commit the result"
            git diff $GENERATED
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Merge gate fixtures (one reviewed merge path; agent-instruction files need Jon)
        # Replaces the fast-path allowlist gate (retired with the fast-path arm,
        # AGENTIC-L5-PLAN §11 R5). Runs FIRST, before any linter, because it is
        # a governance check: it EXECUTES auto-merge.yml's job `if` and
        # `resolve` script and auto-label-codeowners.yml's labeller against a
        # stub `gh`, and fails if a fast-path-only PR, or any PR touching
        # CLAUDE.md / .claude/** / SKILL.md / scripts/**, could auto-merge,
        # or if a merge-path action is not SHA-pinned.
        #
        # `Lint` is in the v3/main ruleset's required_status_checks, so putting
        # this step here is what makes the check BLOCKING. Standing orders: a
        # gate that is not required is advice, not a gate.
        #
        # Stdlib + bash + jq (preinstalled on ubuntu-latest) -- no pip install,
        # so it cannot be skipped by a dependency failure. Exit 3 (jq/bash
        # missing) fails the step too: not-checked is never success.
        run: python3 scripts/check_merge_gate.py

      - name: Install Python deps
        # Pinned via the prod constraints so a new ruff/black release can't turn main red.
        run: pip install ruff black -c apps/worker/constraints-prod.txt
      - name: CODEOWNERS path set agrees across its three copies
        # The set of paths needing Jon's approval is written down three times:
        # .github/CODEOWNERS, auto-label-codeowners.yml (applies the label) and
        # auto-merge.yml's CO_RE (computes the verdict inline so a merge cannot
        # win a race against the labeller — PR #174 merged 36s before its label
        # arrived). A third copy with no gate on it would trade one silent
        # failure for another, so this is wired into Lint, which is a REQUIRED
        # context. A gate that is not in CI is a documented-but-inert control,
        # and this repo has been bitten by several.
        # Exit codes: 0 ok · 1 drift · 2 attempted-and-failed · 3 not-attempted.
        run: python scripts/check_codeowners_drift.py
      - name: ruff check
        run: cd apps/worker && python -m ruff check src/ tests/
      - name: black check
        run: cd apps/worker && python -m black --check src/ tests/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 -- version from package.json packageManager
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm --filter web lint
      - name: Web typecheck (tsc --noEmit)
        # Added PR-Y1.sec-T1: the absence of a tsc gate is how the ChordOverlay
        # broken-import bug reached v3/main (y1-test-coverage-audit.md T1).
        # Catches any import that doesn't resolve, missing export, or type
        # mismatch before a PR can land.
        run: pnpm --filter web typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Bounded, because a hung test is otherwise a 6-hour runner (the default) rather than a
    # red check: this job has no pytest-timeout. The real-R2 tests start an in-process S3
    # server, and a server that cannot bind used to wait for ever. The suite takes about two
    # minutes of pytest locally; 30 leaves room for installs and a slow runner.
    timeout-minutes: 30
    # Postgres so the DB-backed tests (retention sweep, migration 007, consumer) actually
    # run instead of skipping for lack of DATABASE_URL.
    services:
      postgres:
        # PINNED by digest, 2026-11-12. The floating `postgres:16-alpine` tag was
        # republished upstream between two CI runs ~2h apart; the new build makes
        # pg_dump emit a per-column `SET (pg_attver=<varying>)` on every table, so
        # test_zz_schema_matches_fresh_migration failed on UNCHANGED code (v3/main
        # dd26855 green at attempt 1, red at attempt 2). This digest is the last
        # build observed green. Bump it deliberately, never by tag drift.
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: stemloops
          POSTGRES_PASSWORD: stemloops
          POSTGRES_DB: stemloops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        # requirements-dev.txt holds moto, which tests/real_r2.py needs (not in the prod image).
        run: pip install -r apps/worker/requirements.txt -r apps/worker/requirements-dev.txt -c apps/worker/constraints-prod.txt
      - name: Apply migrations (001-007)
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate
      - name: pytest
        run: cd apps/worker && python -m pytest tests/ -v
        env:
          STUB_MODE: "true"
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_ENDPOINT: http://localhost:9000
          R2_BUCKET_NAME: test-bucket
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'  # web unit tests use node's built-in TypeScript stripping (>= 22.6)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 -- version from package.json packageManager
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Web unit tests
        run: pnpm --filter web test
      - name: Node tests
        run: pnpm test

  worker-tests-pg17:
    # WHY THIS JOB EXISTS, and why it is not just a line in `test:`
    # -------------------------------------------------------------
    # Production runs PostgreSQL 17.6 (recorded in
    # apps/worker/tests/fixtures/supabase_prelude.sql, read from the live
    # project). Every Postgres service in this file is 16. So the worker has
    # shipped statements that NO test and NO CI job has ever sent to a server of
    # the version that will run them. The concrete case is the kill-switch gate:
    # `SET LOCAL transaction_timeout = 0` is gated on server_version >= 170000,
    # which means the branch that executes in production is exactly the branch
    # that has never executed anywhere else. On 16 it is skipped; on 17 it is
    # the live path.
    #
    # This is a SEPARATE job rather than a matrix leg on `test:` because "Tests"
    # is a REQUIRED status check on v3/main (ruleset 26478884). Adding a matrix
    # there renames the context to "Tests (…)", the required "Tests" context
    # then never reports, and every open PR blocks forever. A new, non-required
    # job cannot do that. Promote it to required once it has been green for a
    # few runs — that is the owner's call, not an agent's.
    #
    # DRIFT WARNING: the Python setup below mirrors the `test:` job. Duplicated
    # step lists drifting apart is this repo's documented house bug. Keep the
    # two in step, or replace both with a composite action.
    name: "Worker tests (PG 17 = production parity)"
    runs-on: ubuntu-latest
    services:
      postgres:
        # PINNED by digest, 2026-11-12. The floating `postgres:17-alpine` tag was
        # republished upstream between two CI runs ~2h apart; the new build makes
        # pg_dump emit a per-column `SET (pg_attver=<varying>)` on every table, so
        # test_zz_schema_matches_fresh_migration failed on UNCHANGED code (v3/main
        # dd26855 green at attempt 1, red at attempt 2). This digest is the last
        # build observed green. Bump it deliberately, never by tag drift.
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: stemloops
          POSTGRES_PASSWORD: stemloops
          POSTGRES_DB: stemloops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assert the server really is 17 before trusting a green result
        # A job that silently ran 16 would report parity it never tested. This
        # is the non-vacuity check the house convention asks for.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          VER=$(PGPASSWORD=stemloops psql -h localhost -U stemloops -d stemloops -tAc "SHOW server_version_num")
          echo "server_version_num=$VER"
          if [ "$VER" -lt 170000 ]; then
            echo "::error::expected PostgreSQL >= 17, got $VER. This job asserts production parity; a lower version makes every result below meaningless."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        # requirements-dev.txt holds moto, which tests/real_r2.py needs. Without it the
        # retention tests FAIL under CI=true by design, so this job went red on its
        # first real use. Mirrors the `test:` job at line ~145.
        run: pip install -r apps/worker/requirements.txt -r apps/worker/requirements-dev.txt -c apps/worker/constraints-prod.txt
      - name: Apply migrations (001-007)
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate
      - name: pytest
        run: cd apps/worker && python -m pytest tests/ -v
        env:
          STUB_MODE: "true"
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_ENDPOINT: http://localhost:9000
          R2_BUCKET_NAME: test-bucket

  fixture-pipeline:
    name: Fixture pipeline (stub)
    runs-on: ubuntu-latest
    services:
      postgres:
        # PINNED by digest, 2026-11-12. The floating `postgres:16-alpine` tag was
        # republished upstream between two CI runs ~2h apart; the new build makes
        # pg_dump emit a per-column `SET (pg_attver=<varying>)` on every table, so
        # test_zz_schema_matches_fresh_migration failed on UNCHANGED code (v3/main
        # dd26855 green at attempt 1, red at attempt 2). This digest is the last
        # build observed green. Bump it deliberately, never by tag drift.
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: stemloops
          POSTGRES_PASSWORD: stemloops
          POSTGRES_DB: stemloops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      minio:
        # minio/minio was removed from Docker Hub (pull access denied) and quay.io now
        # requires auth. Bitnami's frozen legacy image starts the server from its
        # entrypoint (service containers can't pass `server /data`) and ships curl.
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
    env:
      STUB_MODE: "true"
      DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_ENDPOINT_URL: http://localhost:9000  # what r2_uploader reads (not R2_ENDPOINT)
      R2_BUCKET_NAME: stem-loops-ci
      IP_HASH_KEY: ci-test-key
      HISTORY_COOKIE_KEY: ci-cookie-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r apps/worker/requirements.txt -c apps/worker/constraints-prod.txt
      - name: Create MinIO bucket
        # boto3 is already installed (pinned); `pip install awscli` would re-resolve botocore.
        run: |
          python -c "import os, boto3; boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT_URL'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'], region_name='us-east-1').create_bucket(Bucket=os.environ['R2_BUCKET_NAME'])"
      - name: Run migrations
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate
      - name: Run fixture pipeline (stub mode)
        run: |
          cd apps/worker && PYTHONPATH=src python -m worker.cli test-job "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      - name: Assert stub job finished and uploaded loops
        run: |
          cd apps/worker && python - <<'PY'
          import os, boto3, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              status, loops = c.execute(
                  "SELECT status, (SELECT count(*) FROM loops l WHERE l.job_id = j.id)"
                  " FROM jobs j ORDER BY created_at DESC LIMIT 1").fetchone()
          objs = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                              region_name="us-east-1").list_objects_v2(
              Bucket=os.environ["R2_BUCKET_NAME"]).get("KeyCount", 0)
          print(f"status={status} loops={loops} objects={objs}")
          assert status == "done" and loops > 0 and objs > 0
          PY
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
      - name: Fixture pipeline test (Postgres + MinIO)
        run: cd apps/worker && python -m pytest tests/test_pipeline_fixtures.py -v

  rls-gate:
    name: "RLS gate (SL-B26 #1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Assert RLS + policy on every migration table
        run: python scripts/check_rls.py apps/worker/migrations/

  python-syntax-and-markers:
    # R-2 (session 6 retrospective v2): CI gates every language that ships.
    # Started as PR-Y1.sec-F1 regression guard for apps/training/ only.
    # Session 7 widens to:
    #   - compileall across every Python package (apps/worker, apps/training,
    #     scripts, packages/types)
    #   - merge-conflict marker grep repo-wide for canonical 7-wide markers
    #     on text files (false-positive-free per 2026-11-05 audit)
    # compileall is cheap (syntax-only, no imports) so no training dep install
    # needed on this job.
    name: "Python syntax (compileall) + repo-wide merge markers"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Merge-conflict marker grep (repo-wide, canonical 7-wide)
        # Canonical markers only to avoid false-positives:
        #   ^<<<<<<< <ref>   — conflict begin
        #   ^=======$        — exact-match divider line
        #   ^>>>>>>> <ref>   — conflict end
        # --exclude-dir keeps node_modules / build outputs / git itself out.
        run: |
          if grep -rE '^(<<<<<<< |=======$|>>>>>>> )' \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=.next \
              --exclude-dir=dist \
              --exclude-dir=build \
              --exclude-dir=.turbo \
              .; then
            echo "Unresolved merge markers found. Resolve and re-push."
            exit 1
          fi
      - name: compileall apps/worker
        run: python -m compileall apps/worker/src
      - name: compileall apps/training
        run: python -m compileall apps/training
      - name: compileall scripts
        # scripts/ holds standalone tools; syntax must at least parse.
        run: python -m compileall scripts
      - name: Script unit tests (scripts/test_*.py, stdlib unittest)
        # #366 / #368: scripts/test_*.py never ran in CI (compileall only parses).
        # Every file there is stdlib-unittest (no pytest, no pip install), so this
        # needs no dependency. Runs on every build of this job: no path filter.
        # The ls guard fails the job if the glob ever matches nothing, so the step
        # cannot go green by running zero tests; unittest's own exit code fails it
        # on any failure or error.
        run: |
          set -eu
          ls scripts/test_*.py
          python -W error::ResourceWarning -m unittest discover -v -s scripts -p 'test_*.py'
      - name: compileall packages/types
        # packages/types has python codegen; compileall its py files.
        run: |
          if [ -d packages/types/scripts ]; then
            python -m compileall packages/types/scripts
          fi

  training-tests:
    # R-2 (session 6 retrospective v2): apps/training/tests/ was never executed in CI.
    #
    # Path filtering: an in-job `git diff` gate, NOT a workflow-level `paths:` key
    # and NOT dorny/paths-filter.
    #   - A workflow-level `paths:` filter would stop the whole workflow from
    #     triggering, which would leave a required check "Expected - waiting"
    #     forever on PRs that don't touch training. Unsafe for required checks.
    #   - A job-level `if:` (or dorny/paths-filter + `needs` + `if:`) yields a
    #     *skipped* job, which GitHub counts as passing for required checks, but
    #     dorny adds a third-party action and an extra job for a one-line check.
    #   - The in-job gate keeps the job always running and always reporting a
    #     real success/failure; heavy steps are simply skipped when irrelevant
    #     (a no-op run costs ~10s). Safe to mark as a required check.
    # Runs on every push (main / v3/main) and on PRs touching apps/training/** or
    # this workflow file (so edits to this job are self-validated).
    name: "Training tests (pytest, CPU torch)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2  # PR checkout is a merge commit; HEAD^1 is the base
      - name: Decide whether training tests are relevant
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Push build: always run."
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/training/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No training changes; skipping heavy steps."
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          # No requirements.txt in apps/training; key the pip cache on pyproject.
          cache-dependency-path: apps/training/pyproject.toml
      - name: Install CPU-only torch
        # Default PyPI torch pulls ~2GB of CUDA wheels; the CPU index is a few hundred MB.
        # Installed first so the later `torch>=2.3.0` requirement is already satisfied.
        if: steps.gate.outputs.run == 'true'
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install training deps
        # Read deps from pyproject (single source of truth). Not `pip install -e`:
        # apps/training is a flat layout with several top-level dirs, which
        # setuptools auto-discovery rejects. conftest.py puts apps/ on sys.path.
        # No fluidsynth apt package: synthetic_render imports pyFluidSynth lazily
        # and the tests patch render_midi_to_wav, so nothing needs libfluidsynth.
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY' > "$RUNNER_TEMP/training-reqs.txt"
          import tomllib
          p = tomllib.load(open("apps/training/pyproject.toml", "rb"))["project"]
          print("\n".join(p["dependencies"] + p["optional-dependencies"]["dev"]))
          PY
          pip install -r "$RUNNER_TEMP/training-reqs.txt"
      - name: pytest (apps/training)
        # All tests are hermetic (httpx patched, rendering faked, no data files).
        # onnx/onnxruntime/onnxscript are in pyproject's dev extras ON PURPOSE:
        # test_export_onnx.py importorskip()s the whole file without them, which
        # would make this job report green while the ONNX export path has zero
        # coverage. If you trim those deps to speed the job up, you are deleting
        # that coverage silently — skipped is not passed.
        if: steps.gate.outputs.run == 'true'
        run: cd apps/training && python -m pytest tests/ -v

  check-tsd-refs:
    name: "TSD §N.M refs resolve (Fleet Playbook Move 4)"
    # PR-only: we read the PR body via the GitHub API, so push builds have
    # nothing to validate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Blocking as of session 7 (2026-11-05): noise-tuning period ended clean,
    # TSD-ref typos now fail PRs. See claude/session-7-handover.md §6.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate every TSD §N.M reference resolves to a heading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q .body \
            | python3 scripts/check_tsd_refs.py

  credit-pack-price-recon:
    name: "Credit pack price recon (audit M5)"
    runs-on: ubuntu-latest
    # Repo secrets are unavailable to fork PRs; skip rather than fail there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # THE ONE POLICY SWITCH for this job. Owner decision (Jon).
      #
      # The script exits 3 ("NOT CHECKED") when STRIPE_SECRET_KEY or any
      # STRIPE_PRICE_CREDITS_* secret is unset/empty: nothing was compared.
      #   "0" (default) -> exit 3 fails the job. An unconfigured gate is RED, so
      #                    a green tick always means prices were actually compared.
      #                    CAUTION: if those repo secrets are not set, this is red
      #                    on every PR until they are added.
      #   "1"           -> exit 3 (and ONLY exit 3) becomes a ::warning:: and the
      #                    job passes. Prices were NOT checked; the warning says so.
      #                    It never forgives exit 1 (drift) or exit 2 (broken
      #                    seed, or Stripe/DB lookup failure).
      # Flip to "1" only to knowingly run unguarded until the secrets exist.
      RECON_ALLOW_UNCONFIGURED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install stripe psycopg[binary]
      - name: Reconcile credit_packs prices with Stripe unit_amount
        # Default `--source auto` catches the actual M5 scenario (live DB
        # price edits drifting from Stripe) when DATABASE_URL_CREDIT_PACKS_RO
        # is wired as a repo secret. Falls back to migration 020 seed when
        # the env var is absent. Exit codes: see the script docstring and the
        # RECON_ALLOW_UNCONFIGURED switch above (only exit 3 is ever forgiven).
        run: |
          rc=0
          python scripts/check_credit_pack_prices.py || rc=$?
          if [ "$rc" -eq 3 ] && [ "$RECON_ALLOW_UNCONFIGURED" = "1" ]; then
            echo "::warning title=Credit pack price recon NOT RUN::Stripe secrets are not configured; no prices were compared (RECON_ALLOW_UNCONFIGURED=1)."
            exit 0
          fi
          exit "$rc"
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_CREDITS_20: ${{ secrets.STRIPE_PRICE_CREDITS_20 }}
          STRIPE_PRICE_CREDITS_60: ${{ secrets.STRIPE_PRICE_CREDITS_60 }}
          STRIPE_PRICE_CREDITS_180: ${{ secrets.STRIPE_PRICE_CREDITS_180 }}
          # DATABASE_URL is deliberately NOT mapped here yet. Read before
          # adding it back -- two preconditions and one gotcha.
          #
          # Mapping a secret that does not exist sets the variable to the EMPTY
          # STRING, not to nothing. The script treats that as a
          # misconfiguration and exits 2, because the alternative -- quietly
          # comparing the migration seed while this job's name says it
          # reconciled the live table -- is a green tick over an unchecked M5
          # scenario, reachable by a rename or a rotation. With no mapping at
          # all the variable is genuinely unset, the seed path is taken
          # honestly, and the output says `Expected source: migration 020 seed`.
          #
          # To turn on live DB-vs-Stripe checking, map
          # secrets.DATABASE_URL_CREDIT_PACKS_RO to DATABASE_URL here, once
          # BOTH of these hold:
          #   1. the secret exists, and
          #   2. migration 020 has been applied to the database it points at.
          #      Production was on 008 as of 2026-11-06 and `credit_packs`
          #      arrives in 020, so wiring this before the cutover makes every
          #      PR red with `relation "public.credit_packs" does not exist`.
          #
          # The gotcha: a role with SELECT on credit_packs only still returns
          # ZERO ROWS under 020's RLS, whose policies cover anon/authenticated,
          # stemloops_app and cowork_ro. Fail-closed, but the error reads
          # `packs missing from credit_packs table`, which points at the table
          # contents rather than at RLS. Grant the role one of those roles, or
          # add a policy for it.

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    # Added 2026-11-05 as a PRECONDITION for widening fast-path auto-merge to
    # apps/web/src/ (L2.3). Before this job, NO CI job built apps/web:
    # `Lint` runs eslint, `Types drift check` runs tsc --noEmit, `Tests` runs
    # unit tests. None of them runs `next build`.
    #
    # Vercel does build, but it reports as a commit STATUS ("Vercel"), not a
    # check-run — so scripts/safe_merge.sh (which reads /commits/{sha}/check-runs)
    # never sees it, and it was not among the ruleset's required contexts.
    # A PR that broke the production build could therefore merge green.
    #
    # Vercel's status was NOT simply added as a required context instead,
    # because a skipped Vercel deploy would never report and would then block
    # the branch permanently — the same failure mode as the truncated
    # "RLS gate (SL-B26" context this repo just fixed. This job always runs
    # and always reports.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: next build
        run: pnpm --filter web build
        env:
          # Build-time only. The app reads real values at runtime from Vercel;
          # these exist so `next build` can statically evaluate the modules
          # that reference them without a secret being present in CI.
          NEXT_TELEMETRY_DISABLED: "1"


  chord-chip-browser-gate:
    name: Chord chip fit (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45  # #333: the chord-stage sweeps (3 demos x 4 phones x 2 views, every 0.37 s) take ~25 min
    # The chord overlay is the product's differentiator and its gate in
    # apps/web/test/chord-default-zoom.test.mjs runs in happy-dom, which has no
    # layout engine and cannot see a clipped chord name. This job renders the
    # real ChordOverlay in real Chromium and measures every chip.
    # Source: packages/web-browser-gate/test/chord-chip-fit.test.mjs.
    #
    # *** NOT YET A REQUIRED STATUS CHECK. *** The v3/main ruleset lists its
    # required contexts by name and only the repo owner can edit it. Until
    # "Chord chip fit (real Chromium)" is added there this job reports but blocks
    # nothing. No JOB-level path filter, on purpose: a required check that does
    # not run for some PRs waits forever. The IN-JOB gate below ("Decide whether
    # chord rendering can have changed") keeps the job always-run, always-report:
    # when no changed path can affect chord rendering it ends SUCCESS in ~30 s
    # with every heavy step `if:`-skipped, so the check still reports green.
    # Push builds (main / v3/main) and any git failure always run the full sweep.
    # The path set is deliberately generous (when in doubt, run): the job runs
    # ALL packages/web-browser-gate/test/*.test.mjs, which bundle the real Player,
    # History page, ProcessingHeading and globals.css from apps/web, plus its
    # fixtures, and apps/web/tsconfig.json maps @stem-loops/types to
    # packages/types/src. Hence: apps/web/, packages/, fixtures/
    # (contracts/harte-labels.json), .github/actions/, root package.json / lockfile / workspace / .npmrc, and
    # this workflow file (so edits to this job are self-validated).
    #
    # MERGE ORDER (a transition, not a steady state): this job is RED on any tree
    # that lacks PR #212's chip-fit fixes, `v3/main` included -- correctly. So
    # (1) merge #212, (2) rebase this PR onto it, (3) see this job GREEN in CI
    # for the first time, (4) add the check to the ruleset in that same sitting.
    # Merged before #212 and left non-required it is red on every PR, the
    # permanently-red-smoke pattern; required before #212 it blocks every PR.
    # (With the path gate above, PRs that touch no gated path report green even
    # while the base is red: they cannot affect chord rendering.)
    #
    # Chromium: pinned to the Playwright version in pnpm-lock.yaml (1.63.0 ->
    # Chromium build 1243). `playwright install` MUST be the repo's own copy
    # (pnpm exec), never a global or `npx playwright@latest`, or the browser it
    # downloads will not be the one the pinned library launches.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2  # PR checkout is a merge commit; HEAD^1 is the base
      - name: Decide whether chord rendering can have changed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull_request build: always run the full sweep."
            exit 0
          fi
          # -z + --no-renames: NUL-separated, never quoted (non-ASCII / tab names),
          # and a rename lists BOTH old and new path (a move out of apps/web counts).
          if ! git diff -z --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.z" || [ ! -s "$RUNNER_TEMP/changed.z" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Could not compute a changed-file list: run (fail safe)."
            exit 0
          fi
          tr '\0' '\n' < "$RUNNER_TEMP/changed.z"
          if grep -qzE '^(apps/web/|packages/|fixtures/|\.github/actions/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|\.nvmrc$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.z"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No chord-rendering path changed; skipping install, Chromium and the sweep (reporting success)."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.run == 'true'
      - name: pnpm install
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Resolve pinned Playwright version
        if: steps.gate.outputs.run == 'true'
        id: pw
        run: echo "version=$(pnpm --filter @stem-loops/web-browser-gate exec node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.gate.outputs.run == 'true'
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.gate.outputs.run == 'true'
        # --with-deps also installs the OS libraries and fonts Chromium needs
        # (apt). The browser download is skipped on a cache hit; the apt step is
        # not cacheable and is most of the cost.
        run: pnpm --filter @stem-loops/web-browser-gate exec playwright install --with-deps chromium
      - name: Chord chips fit (real Chromium)
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @stem-loops/web-browser-gate test
        env:
          CHORD_GATE_LOG: "1"

  browser-journeys:
    name: Browser journeys (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ADVISORY. continue-on-error is BACK, deliberately, after being removed
    # earlier in this same PR. Read the "WHY THIS IS STILL ADVISORY" block below
    # before taking it out again -- the evidence against promoting is from this
    # job, on this branch, and it is not an argument anyone has to re-derive.
    #
    # The NAME no longer says "advisory", and that is on purpose: whether this
    # job blocks is a property of continue-on-error, not of its name, and
    # encoding mutable state in a check CONTEXT means a ruleset edit every time
    # the state changes. The name is stable now; the comment carries the state.
    #
    # #245 added this job advisory, on the rationale that "4 of 8 journeys fail
    # on open product findings (j3 SEPARATION_FAILED copy #243, j7 44 px targets,
    # j8 axe contrast)". That rationale no longer holds, and one third of it was
    # never true:
    #   * #243 (failed-job copy) and #244 (chord provider_failed copy) are merged,
    #     and j7's 44 px targets were fixed inside #245 itself (they were a real
    #     finding: job 133644482368 on 6966422, "Download loops -> 118x40");
    #   * "j8 axe contrast" was never a finding this job could produce. JOURNEY_AXE
    #     was unset, so j8-a11y.mjs reported all four of its axe scans
    #     `not-reached` -- on every run, green ones included.
    #
    # WHAT THE BASE COMMIT ACTUALLY DID. The only run of this job on b4a3852
    # (job 133727904155) was 81 PASS / 1 FAIL / 4 not-reached -- RED. The failure
    # was j8's `Enter on "Choose a file" opens the file chooser`: focus landed on
    # #file-btn and the event never fired. 2e2f20b and 3ca0bff are descendants
    # whose whole diff from it is this file, the gate package's package.json and
    # pnpm-lock.yaml -- nothing under apps/ at all -- and the same check passes on
    # both. That is a flake, not a finding.
    #
    # THE FLAKE. Every figure below was re-derived from the Actions API, not
    # carried forward -- three earlier versions of this comment each shipped a
    # wrong number here. 14 runs of this job exist; 5 ended red. Three of those
    # five are explained, and are the gate working:
    #   1afce88  job 132612457410  j7 44 px targets (pre-fix)
    #   ac3c3a1  job 133608181185  j1 "Cut N loops" -- a real race, fixed next commit
    #   6966422  job 133644482368  j7 44 px targets, "Download loops -> 118x40"
    # The remainder are all ONE check -- j8's `Enter on "Choose a file" opens the
    # file chooser` -- on 3 occasions across 4 attempts:
    #   b4a3852  job 133727904155  red (no retry existed yet)
    #   f9ad9b5  job 133777063521  attempt 1 red, attempt 2 clean -> job green
    #   db2e57d  job 133784823424  BOTH attempts red -> job red
    # The window in which apps/web and apps/worker do not change at all starts at
    # b4a3852 and runs to fc03e86: `git diff --name-only b4a3852 fc03e86` touches
    # only .github, packages and pnpm-lock.yaml. That is 8 runs (9 counting
    # a1b0e58 -- same tree, pre-squash). So: 3 occasions in 8 runs, 2 of them in
    # the last 6. Still a small n -- do NOT quote it as a rate -- but three
    # sightings of one check is not an anomaly. Tracked as #286.
    #
    # f9ad9b5 is the first live proof that the retry does what it claims: attempt
    # 1 red on that check, attempt 2 clean (8 journeys, 0 failed, written to
    # .evidence/attempt-2/), job green, annotation raised.
    #
    # WHY THIS IS STILL ADVISORY -- and the retry is not enough.
    # The very next run, db2e57d (job 133784823424), failed BOTH attempts on that
    # same check with the same detail line. That commit's diff is COMMENTS IN
    # THIS FILE AND NOTHING ELSE. So:
    #   * the flake is correlated WITHIN a runner. A retry assumes the second
    #     attempt is an independent draw; this one was not, and the retry cleared
    #     nothing. The round-2 reasoning for promoting rested on an independence
    #     nobody had measured, and the measurement has now come back negative.
    #   * had continue-on-error already been gone, a comment-only change would
    #     have been blocked from merging. That is not a hypothetical -- it is what
    #     this job did to db2e57d.
    #   * the tally is 3 occasions on this one check (b4a3852, f9ad9b5 attempt 1,
    #     db2e57d both attempts) across the 8 runs over an unchanged apps/web and
    #     apps/worker, 2 of them in the last 6. It is not getting rarer.
    # Promoting a gate to blocking while it has a known, unfixed, reproducing
    # failure breaks every subsequent PR, which is the one thing this change was
    # not allowed to do. So continue-on-error stays until #286 is fixed.
    #
    # WHAT THE RETRY IS FOR NOW. Its purpose has changed, and this is the honest
    # statement of it. It was added to MITIGATE the flake; db2e57d showed it does
    # not -- when the failure is correlated within a runner it clears nothing.
    # What it does do, and what nothing else here does, is tell you WHETHER A RED
    # REPRODUCES. One red attempt and one clean one is a flake; two red attempts
    # is something broken. Without it, b4a3852 and db2e57d read identically, and
    # the single most useful fact about #286 -- that the failure survives a full
    # re-run of the suite on the same runner -- could not have been learned. It
    # is an instrument, not a mitigation. Cost, from the API: a single-attempt
    # job is 8m07s (job 133768171344) to 8m42s (133792904141), and the two
    # retried runs took 12m15s (133777063521) and 13m11s (133784823424) -- so
    # ~3.5-4.5 min, only ever on an already-red run, inside a 25-minute cap.
    #
    # EVERYTHING ELSE IN THIS PR STANDS AND IS THE POINT OF IT: j8's four axe
    # scans actually run, they cannot silently skip, they gate on WCAG, the
    # /account and /pricing scans cannot run against a redirect or an error page,
    # and the evidence artifact uploads for the first time since #245.
    #
    # The journeys step therefore runs the suite a SECOND time when the first
    # attempt is red, and emits a ::warning:: when it does. If attempt 1 was red
    # and attempt 2 green, THIS SUITE FLAKED -- read both summaries in the
    # browser-journeys-evidence artifact before dismissing it. Two independent
    # reds still fail.
    #
    # That last instruction is only followable as of this PR: the upload step had
    # silently uploaded nothing since #245 (see its own comment below), so for the
    # first three rounds of this change "read the evidence artifact" named
    # something that did not exist. Fixed here, not worked around.
    #
    # The axe scans are now on (see the resolve step below). The first run that
    # actually scanned -- 2e2f20b on PR #285 -- is 86 PASS / 0 FAIL /
    # 0 not-reached; reproduced on 3ca0bff. All four scans (landing, player,
    # /account, /pricing) report zero critical or serious WCAG violations. That
    # is the claim to re-check if this job starts failing on a11y rather than on
    # a product change.
    #
    # WHAT PROMOTION WOULD ACTUALLY CHANGE, when it eventually happens. Less than
    # it looks like. continue-on-error suppresses only the WORKFLOW RUN's
    # conclusion: the check-run is already `failure` on a red journey (b4a3852
    # and 6966422 are the proof -- both ran WITH continue-on-error set and both
    # recorded conclusion `failure`. db2e57d does NOT prove it: that run had
    # continue-on-error removed, so it says nothing about suppression), so
    # auto-merge.yml's M-1 sweep over every check-run on the head SHA ALREADY
    # refuses to auto-merge on one, today, advisory and all -- which is a point
    # in favour of the name: a check that looks like it matters is more accurate
    # than one labelled advisory. Removing continue-on-error would add a red RUN
    # conclusion, which also stops auto-merge.yml's post-CI `workflow_run` path
    # from starting. Adding the context to the v3/main ruleset (v3-main-
    # protection, id 26478884) is a repository setting no PR can make, and what
    # IT adds is a hold on a human pressing merge by hand. The exact context
    # string is this job's name: "Browser journeys (real Chromium)".
    #
    # DO NOT ADD THE CONTEXT TO THE RULESET YET. The retry above is a bridge, not
    # a feature, and this is what stops it becoming permanent. Add the context
    # when EITHER of these is true, and not before:
    #   (a) issue #286 is closed -- the file-chooser race is diagnosed and fixed; OR
    #   (b) this job has run green on v3/main for 10 CONSECUTIVE runs in which the
    #       retry never fired; one firing restarts the count at zero. Use EITHER
    #       of these two, both verified against a real retry run (job
    #       133777063521) AND real non-retry runs (133768171344, 133755569798):
    #
    #         # 1 = no retry, 2 = retried
    #         gh api repos/JDC000000/stem-loops/actions/jobs/<id>/logs \
    #           | grep -c 'journeys, [0-9]* failed'
    #
    #         # 0 = no retry, 1 = retried
    #         gh api repos/JDC000000/stem-loops/check-runs/<id>/annotations \
    #           --jq '[.[] | select(.title=="Browser journeys flaked")] | length'
    #
    #       DO NOT grep the job log for the warning text, by any pattern. The
    #       runner echoes the step's own script into its ##[group] header, so a
    #       bare "Browser journeys flaked" matches on EVERY run -- and the
    #       ##[warning]-prefixed form matches on NONE, including runs where the
    #       retry did fire, because `::warning::` from a `run:` step becomes a
    #       check-run ANNOTATION and never appears as ##[warning] in the log text.
    #       The first mistake makes the bar impossible; the second makes it
    #       vacuous. Both were committed to this file before being checked in both
    #       directions. The two commands above were.
    # (b) is a real bar, not a formality: if the flake persists at anything like
    # the frequency #286 records, ten clean runs in a row will not arrive, and the
    # right answer is to fix it rather than to lower the bar. If neither (a) nor
    # (b) has happened a month from now, take the retry OUT as well and reopen the
    # question -- a permanent retry on a gate is a gate that quietly reports less
    # than it claims.
    #
    # Promotion is ONE decision with two steps, and neither happens before the
    # condition above holds: remove continue-on-error here, THEN add the context
    # to the ruleset. Do not do the first on its own as "the safe half" -- the
    # first is what blocked db2e57d.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: stemloops
          POSTGRES_PASSWORD: stemloops
          POSTGRES_DB: stemloops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 55432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps (pnpm, worker, mocks, ffmpeg, psql)
        run: |
          pnpm install --frozen-lockfile
          pip install -r apps/worker/requirements.txt -r apps/worker/requirements-dev.txt -c apps/worker/constraints-prod.txt moto[server] boto3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg postgresql-client
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Install Chromium and its system libraries
        run: pnpm --filter @stem-loops/web-browser-gate exec playwright install --with-deps chromium
      - name: Bring up the loopback stack (prelude + migrations, mocks, worker, next build + start)
        run: packages/web-browser-gate/stack/up.sh
      - name: Resolve axe-core for j8's accessibility scans
        id: axe
        # j8-a11y.mjs SKIPS its four axe scans -- landing, player, /account,
        # /pricing -- and reports them `not-reached` when JOURNEY_AXE is unset or
        # names a path that does not exist. Resolving it from the gate package's
        # own declared dependency, rather than hardcoding a path under
        # node_modules/.pnpm, means a version bump that moves the file fails HERE,
        # loudly, instead of silently turning the scans back off.
        run: |
          AXE=$(pnpm --filter @stem-loops/web-browser-gate exec node -p "require.resolve('axe-core/axe.min.js')")
          test -s "$AXE"
          echo "axe-core: $AXE"
          echo "path=$AXE" >> "$GITHUB_OUTPUT"
      - name: Run all journeys (one retry on red; both attempts kept as evidence)
        env:
          JOURNEY_AXE: ${{ steps.axe.outputs.path }}
        # Mitigation for #286, not a fix for it; the ruleset condition in this job's
        # comment is what keeps it temporary.
        # A retry is a hiding place, so this one is loud: the ::warning:: survives
        # into the run summary of an otherwise green job, and attempt 2's evidence
        # is kept SEPARATELY (under .evidence/attempt-2/, already inside the
        # uploaded directory) instead of overwriting attempt 1's. A full re-run,
        # not a re-run of the failed ids: run.mjs exits 1 on any subset ("PARTIAL
        # RUN") regardless of verdict, so a subset retry would need its summary
        # parsed to be read at all -- more code to be wrong in, on a gate. The
        # suite is re-runnable: every journey mints its own user (Date.now-keyed)
        # and j4 computes capacity from the live in-flight count.
        run: |
          set -uo pipefail
          if packages/web-browser-gate/stack/journeys.sh; then exit 0; fi
          echo "::warning title=Browser journeys flaked::Attempt 1 was RED and is being re-run once. If this job ends green, the suite FLAKED: compare .evidence/summary.md (attempt 1) with .evidence/attempt-2/summary.md in the browser-journeys-evidence artifact before dismissing it."
          JOURNEY_EVIDENCE_DIR="$GITHUB_WORKSPACE/packages/web-browser-gate/.evidence/attempt-2" \
            packages/web-browser-gate/stack/journeys.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-journeys-evidence
          path: packages/web-browser-gate/.evidence/
          # WITHOUT THIS, THE ARTIFACT DOES NOT EXIST. upload-artifact@v4 excludes
          # dot-prefixed paths unless told otherwise, and this path is `.evidence/`.
          # Every run of this job up to and including 61aa309 logged
          #   ##[warning]No files were found with the provided path: ... .evidence/
          # and uploaded nothing -- confirmed by GET /actions/runs/{id}/artifacts
          # returning total_count: 0 for ALL ELEVEN of them (jobs 132612457410,
          # 133608181185, 133616261619, 133622072123, 133644482368, 133654496177,
          # 133727904155, 133732244277, 133739422301, 133755569798, 133768171344;
          # re-counted from the API, an earlier draft of this comment said seven).
          # The step reported success throughout, which is the same defect class
          # this job is for.
          # Consequence worth knowing: on b4a3852, the one red run this project
          # has, the screenshots and result.json that would have diagnosed the
          # file-chooser race (#286) were discarded.
          include-hidden-files: true


  supabase-prelude-migrations:
    name: Migrations on a Supabase-like Postgres (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs always run. A 17 failure must not hide the 16 result, and a 16
      # failure must not hide 17 — 17 is the version production actually runs.
      fail-fast: false
      matrix:
        pg: ['16', '17']
    # AGENTS.md §11 M-3 asked for this job by name.
    #
    # Every other migration step in this file runs as a SUPERUSER against bare
    # Postgres. A superuser bypasses privilege checks, and bare Postgres has no
    # `auth` schema at all, so an entire class of Supabase-only failure is
    # invisible to CI. Migration 012 is the proof: `42501 permission denied for
    # schema auth` on Supabase, green here, found only by rehearsing against a
    # real project on the day of the production cutover.
    #
    # This job runs the real runner over every real migration as a role shaped
    # like Supabase's `postgres`: NOSUPERUSER, owns the database, no CREATE on
    # `auth`.
    #
    # VERSIONS — PRODUCTION RUNS PostgreSQL 17.6. That number is not a guess:
    # apps/worker/tests/fixtures/supabase_prelude.sql records it as read from the
    # live project (qthrhamfljhifhfwvvwj), and the rehearsal project is 17.11.
    #
    # Until this matrix existed, every migration in this repo was validated ONLY
    # on 16, while this job's own comment asserted that "nothing this job
    # exercises differs between 16 and 17" — an assertion no test could fail,
    # which is this project's house bug wearing the costume of its own cure. The
    # matrix below runs both, so that claim is now measured instead of stated.
    # 16 is kept because every other job in this file still uses it; 17 is the
    # leg that must be green before a migration reaches production.
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r apps/worker/requirements.txt -c apps/worker/constraints-prod.txt

      - name: Apply the Supabase-like prelude (as superuser)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f apps/worker/tests/fixtures/supabase_prelude.sql

      # Without this the job could pass while testing nothing: grant CREATE on
      # `auth` by accident and every migration sails through exactly as it does
      # on bare Postgres — a green tick over a gate that quietly stopped being a
      # gate. That is this project's house bug, so the gate pins its own
      # preconditions. This list must stay identical to the CALIBRATION block in
      # the prelude. Values read from a live Supabase project 2026-11-06.
      - name: Assert the prelude still reproduces Supabase
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          fail=0
          check() {
            got=$(psql -h localhost -U postgres -d postgres -tAc "$2")
            if [ "$got" != "$3" ]; then
              echo "::error::prelude drift: $1 is '$got', expected '$3'"
              fail=1
            else
              echo "  ok  $1 = $got"
            fi
          }
          check "create_on_database" "SELECT has_database_privilege('migrator',current_database(),'CREATE')" "t"
          check "create_on_auth"     "SELECT has_schema_privilege('migrator','auth','CREATE')"               "f"
          check "usage_on_auth"      "SELECT has_schema_privilege('migrator','auth','USAGE')"                "t"
          check "select_auth_users"  "SELECT has_table_privilege('migrator','auth.users','SELECT')"           "t"
          check "trigger_auth_users" "SELECT has_table_privilege('migrator','auth.users','TRIGGER')"          "t"
          check "is_superuser"       "SELECT rolsuper FROM pg_roles WHERE rolname='migrator'"                 "f"
          check "bypassrls"          "SELECT rolbypassrls FROM pg_roles WHERE rolname='migrator'"             "t"
          check "createrole"         "SELECT rolcreaterole FROM pg_roles WHERE rolname='migrator'"            "t"
          check "database_owner"     "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname=current_database()" "migrator"
          check "public_owner"       "SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname='public'"        "pg_database_owner"
          exit $fail

      - name: Run every migration as the restricted role
        env:
          DATABASE_URL: postgresql://migrator:migrator@localhost:5432/postgres
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate

      - name: Assert the whole chain landed, and that grants were not silent no-ops
        env:
          PGPASSWORD: migrator
        run: |
          set -euo pipefail
          q() { psql -h localhost -U migrator -d postgres -tAc "$1"; }
          # `find -maxdepth 1` rather than `ls *.sql`: ls would expand a
          # DIRECTORY named *.sql into its contents and miscount. This mirrors
          # the runner's top-level-only glob.
          expected=$(find apps/worker/migrations -maxdepth 1 -name '*.sql' -type f | wc -l | tr -d ' ')
          actual=$(q "SELECT count(*) FROM public._migrations")
          echo "repo migrations: $expected   ledger rows: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::ledger holds $actual rows but the repo has $expected migrations"
            exit 1
          fi
          # Migration 011 grants stemloops_app USAGE on public. Under an earlier
          # prelude that executed as `WARNING: no privileges were granted` and
          # psycopg swallowed it — green chain, wrong ACL. Assert the explicit
          # grantee entry, not has_schema_privilege, which is also true via the
          # PUBLIC pseudo-role and so cannot distinguish the two.
          acl=$(q "SELECT COALESCE(nspacl::text,'') FROM pg_namespace WHERE nspname='public'")
          echo "public acl: $acl"
          case "$acl" in
            *stemloops_app=U*) echo "  ok  011's grant took effect" ;;
            *) echo "::error::011's GRANT USAGE ON SCHEMA public TO stemloops_app did not take effect — likely a silent no-op"; exit 1 ;;
          esac

      - name: Re-run to prove idempotency
        env:
          DATABASE_URL: postgresql://migrator:migrator@localhost:5432/postgres
        run: cd apps/worker && PYTHONPATH=src python -m worker.migrate

      # Smoke-runs the code-to-schema drift gate from the sibling PR.
      #
      # BE CLEAR ABOUT WHAT THIS DOES NOT DO. It checks a ledger this job just
      # populated itself, from this same checkout, so it can never report
      # drift. It proves the gate executes and reads a real ledger; it does not
      # protect production. As of 2026-11-06 prod's `_migrations` holds 8 rows
      # against 30 in the repo and nothing here turns red over it. Closing that
      # needs a read-only ledger credential as a secret (house pattern:
      # `DATABASE_URL_CREDIT_PACKS_RO`) or a deploy-time hook. Tracked; not
      # done.
      #
      # The conditional ships WITH its condition (L25): this ref does not
      # contain the script, so the step skips today and starts running by
      # itself once the gate merges, with no coordination.
      - name: Run the code-to-schema drift gate against the migrated database
        if: hashFiles('scripts/check_migration_drift.py') != ''
        env:
          DATABASE_URL: postgresql://migrator:migrator@localhost:5432/postgres
        run: python scripts/check_migration_drift.py

      # A step that silently skips forever is exactly this project's house bug,
      # so the skip is made loud. When the warning stops appearing, the guard
      # above has served its purpose and can be deleted.
      - name: Say plainly whether the drift gate ran
        run: |
          if [ -f scripts/check_migration_drift.py ]; then
            echo "drift gate present and executed in the previous step"
          else
            echo "::warning::scripts/check_migration_drift.py is not on this ref, so the drift gate step above was SKIPPED. Once that PR has merged, this warning disappears and the hashFiles guard can be removed."
          fi
