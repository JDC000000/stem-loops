name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  types-drift:
    name: Types drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install pydantic>=2.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
        working-directory: packages/types
      - name: Regenerate types
        run: cd packages/types && python scripts/codegen.py
      - name: Check for type drift
        run: |
          if ! git diff --exit-code packages/types/src/; then
            echo "TYPE DRIFT DETECTED: run 'make types-generate' and commit the result"
            git diff packages/types/src/
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install ruff black
      - name: ruff check
        run: cd apps/worker && python -m ruff check src/ tests/
      - name: black check
        run: cd apps/worker && python -m black --check src/ tests/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm --filter web lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r apps/worker/requirements.txt
      - name: pytest
        run: cd apps/worker && python -m pytest tests/ -v
        env:
          STUB_MODE: "true"
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_ENDPOINT: http://localhost:9000
          R2_BUCKET_NAME: test-bucket
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Node tests
        run: pnpm test || true

  fixture-pipeline:
    name: Fixture pipeline (stub)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stemloops
          POSTGRES_PASSWORD: stemloops
          POSTGRES_DB: stemloops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r apps/worker/requirements.txt
      - name: Create MinIO bucket
        run: |
          pip install awscli
          AWS_ACCESS_KEY_ID=minioadmin \
          AWS_SECRET_ACCESS_KEY=minioadmin \
          aws --endpoint-url http://localhost:9000 s3 mb s3://stem-loops-ci
      - name: Run migrations
        run: cd apps/worker && python migrations/migrate.py
        env:
          DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
      - name: Run fixture pipeline (stub mode)
        run: |
          cd apps/worker && python -m src.main --run-once "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        env:
          STUB_MODE: "true"
          DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
          R2_ACCESS_KEY_ID: minioadmin
          R2_SECRET_ACCESS_KEY: minioadmin
          R2_ENDPOINT: http://localhost:9000
          R2_BUCKET_NAME: stem-loops-ci
          IP_HASH_KEY: ci-test-key
          HISTORY_COOKIE_KEY: ci-cookie-key
