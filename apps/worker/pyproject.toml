[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stem-loops-worker"
version = "0.1.0"
description = "Stem Loops audio pipeline worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "replicate>=0.31.0",
    "yt-dlp>=2026.8.19",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "sentry-sdk>=2.66.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
