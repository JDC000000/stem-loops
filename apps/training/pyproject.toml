[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stem-loops-training"
version = "0.2.0"
description = "ChordNet training pipeline for stem-loops V3 (Y1 clean-recipe)"
requires-python = ">=3.11"
dependencies = [
    # Core deep learning
    "torch>=2.1",
    "torchaudio>=2.1",
    # Audio / DSP
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    # Chord-eval and MIR utilities
    "mir_eval>=0.7",
    # MIDI + synthetic rendering (PR-Y1.3).
    # music21 is required at runtime by apps/training/data/synthetic_render.py;
    # it was dropped in PR-Y1.4's pyproject rewrite and MUST stay here (QA-B H2).
    "music21>=9.1",
    "pretty_midi>=0.2.10",
    "pyFluidSynth>=1.3.3",
    # Data download + manifest
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]
# PR-Y1.4 optional: weights & biases run tracking.
wandb = [
    "wandb>=0.17.0",
]

# Mirrors apps/worker/pyproject.toml so the two Python packages lint the
# same way. Ruff's I ruleset handles import sorting (no isort).
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The `training` package lives at this directory (`apps/training/`). Adding
# the parent (`apps/`) to pythonpath makes `from training.data.sources ...`
# resolve the same way it does when the package is pip-installed editable.
# Dropped by PR-Y1.4 rewrite; restored here (QA-B H2) so pytest collection
# of apps/training/tests/test_synthetic_render.py keeps resolving.
pythonpath = [".."]
