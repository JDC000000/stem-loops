# Auto-apply `needs-jon-approval` label to any PR whose diff touches a path
# listed in .github/CODEOWNERS. Companion to auto-merge.yml:
# CODEOWNERS says "Jon owns these paths"; this workflow says "if your PR
# touches those paths, it gets the manual-review label and the auto-merge
# workflow refuses to fire until Jon labels or merges by hand".
#
# IMPORTANT: when .github/CODEOWNERS changes, update the regex below to
# match. Patterns are inlined because GitHub Actions has no CODEOWNERS
# parser in the standard library. The regex matches EVERY pattern in
# CODEOWNERS (including the forward-looking ones — those simply can't
# fire until the paths exist). Any CODEOWNERS pattern missing from the
# regex is a GAP; any regex alternation missing from CODEOWNERS is a LEAK.

name: Auto-label CODEOWNERS-touching PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-needs-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Check diff against CODEOWNERS paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # REST file list, NOT `gh pr diff --name-only`, and previous_filename
          # too (R5 review R1, should-fix 3): renaming an owned file (e.g.
          # CLAUDE.md -> docs/notes.md) deletes the owned path, so it must be
          # labelled. `pr diff --name-only` lists only the new name. Under
          # `set -euo pipefail` a failed or partial read fails this job loudly
          # (and auto-merge.yml's CO_RE check fails closed independently).
          changed=$(gh api --paginate "repos/$REPO/pulls/$PR_NUM/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          echo "Changed files in PR #$PR_NUM:"
          echo "$changed"
          echo
          # Keep this regex in sync with .github/CODEOWNERS, which enumerates
          # the patterns explicitly in its header.
          #
          # 2026-11-05 T1+T2 trim: regex reduced to match the 8 narrow patterns
          # that survived (this comment and the CODEOWNERS header both said "6"
          # until 2026-11-05; the real count was always 8 and the regex always
          # covered all of them, so there was no GAP or LEAK — just a wrong
          # number instructing the next editor). Removed paths are now guarded
          # by .claude/settings.json deny rules (for subagents) and the main
          # session's safe_merge.sh discipline. See claude/session-7-handover.md §4.
          #
          # Alternation, in order, 14 terms:
          #   1 apps/web/src/lib/billing/        5 commercial migrations
          #   2 apps/worker/src/worker/billing/  6 .github/workflows/
          #   3 apps/web/src/app/api/billing/    7 .github/CODEOWNERS
          #   4 apps/web/src/app/api/entitlements/  8 AGENTS.md (any depth)
          #   9 CLAUDE.md (any depth)           11 SKILL.md (any depth)
          #  10 .claude/ (any depth)            12 CLAUDE.local.md (any depth)
          #  13 .mcp.json (any depth)           14 scripts/
          # 9-14 added 2026-11-22 (AGENTIC-L5-PLAN §11 R5): agent-instruction
          # files and the gate scripts. Byte-identical to auto-merge.yml CO_RE;
          # scripts/check_codeowners_drift.py fails Lint if they diverge.
          if echo "$changed" | grep -qE '^(apps/web/src/lib/billing/|apps/worker/src/worker/billing/|apps/web/src/app/api/billing/|apps/web/src/app/api/entitlements/|apps/worker/migrations/[^/]*_v3_commercial[^/]*\.sql$|\.github/workflows/|\.github/CODEOWNERS$|(.*/)?AGENTS\.md$|(.*/)?CLAUDE\.md$|(.*/)?\.claude/|(.*/)?SKILL\.md$|(.*/)?CLAUDE\.local\.md$|(.*/)?\.mcp\.json$|scripts/)'; then
            echo "PR touches a CODEOWNERS path. Applying needs-jon-approval label."
            gh pr edit "$PR_NUM" --repo "$REPO" --add-label needs-jon-approval
          else
            echo "No CODEOWNERS paths touched. Leaving labels alone."
          fi
