# autonomy-class — CONTENT-ONLY class for the bot merge path
# (AGENTIC-L5-PLAN v1.2.1 §2 R1, rebuilt per Jon's decision, LEDGER-18
# row 143, and NARROWED by Jon on 2026-11-23, LEDGER-19A row 49).
#
# Posts ONE check-run named `autonomy-class` on the PR head commit:
#   conclusion success, title `auto`   — every changed file is a modified,
#                                        allowed, non-denied text file, and a
#                                        PARSER proved base and head differ
#                                        ONLY in (a) plain JSX text directly
#                                        inside <p>/<h1-6>/<li>/<span>/
#                                        <strong>/<em>, or (b) the value of a
#                                        CSS `color` / `background-color`
#                                        declaration in a strict colour
#                                        grammar (scripts/autonomy_class.py)
#   conclusion neutral, title `human`  — anything else, INCLUDING any error in
#                                        this workflow (fail closed)
#
# BINDING (review R3 O1). The class is for ONE (head SHA, base SHA) pair. The
# check-run's external_id is the base SHA it was computed against, and the
# summary names both. Right before posting, this workflow re-reads the PR and
# the v3/main ref; if the head or base moved, or base is no longer the
# v3/main tip, it posts `human`. v3/main moving LATER triggers no re-run, so:
#
# CONSUMER RULE (for the bot merge path; not wired in by this PR): read the
# LATEST check-run named `autonomy-class` on the exact head SHA whose app is
# the GitHub Actions app (app id 15368, slug github-actions), and treat the PR
# as `auto` only if conclusion == success AND output.title == auto AND
# external_id == the CURRENT v3/main tip SHA. Anything else (missing, older,
# other app, other base) is `human`. (R3 O2: a same-repo `pull_request`
# workflow with checks: write could also post under app 15368; the merge path
# should therefore also recompute the class from base code or check the
# check-run's workflow; tracked outside this PR.)
#
# `auto` is an input to the bot path, never a merge by itself. This workflow
# does not label, comment, approve or merge, and auto-merge.yml does not read
# it yet (wiring it in is a separate Jon-owned change; see the PR body).
#
# The parser is the `typescript` package at the version pnpm-lock.yaml on
# v3/main pins. Its tarball is downloaded from the npm registry, checked
# against the lockfile's sha512 BEFORE it is unpacked, and unpacked without
# running any install script. The PR's bytes are only PARSED by it
# (ts.createSourceFile) — never type-checked, transpiled, resolved or run.
#
# ── WHY pull_request_target, AND WHY IT IS SAFE HERE ─────────────────────────
# pull_request_target runs THIS FILE as it exists on the BASE branch, with a
# token that can write check-runs. That is what makes the class trustworthy:
# a PR cannot edit the workflow, the checker (scripts/autonomy_class.py) or
# the lists (.github/autonomy/*.txt) and have its own edit judge it.
# The classic danger of pull_request_target is checking out and running PR
# code with that token. This workflow NEVER does: it checks out v3/main only
# (persist-credentials: false), and reads the PR's file list (from
# compare/<base_sha>...<head_sha>, pinned to SHAs), patches, git modes and
# the HEAD and BASE blob bytes of each changed file through the REST API as
# DATA. Nothing from
# the PR is executed, imported, installed or interpolated into a script; PR
# fields reach the shell only through env vars.
#
# ── PERMISSIONS ─────────────────────────────────────────────────────────────
# checks: write (post the check-run), contents: read (git trees + blobs),
# pull-requests: read (PR + file list). Nothing else.
#
# Every `uses:` is pinned to a full 40-hex commit SHA (§11 R5 rule for merge-
# path workflows). There is exactly one: actions/checkout. The parser
# download is pinned by content hash (the lockfile's sha512), not by tag.

name: autonomy-class

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: autonomy-class-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: autonomy-class (compute)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only PRs INTO v3/main are classified (review R1 #5). pull_request_target
    # runs the workflow, and would read the lists, from whatever branch a PR
    # targets; an agent that can push a branch could give that branch
    # `allow.txt = **`, open a PR into it and collect an Actions-app success
    # on a head SHA it later points at v3/main. PRs into any other branch get
    # no autonomy-class check at all, and the checker refuses a non-v3/main
    # base too (R0), so this `if` is not the only guard.
    if: github.event.pull_request.base.ref == 'v3/main'
    steps:
      - name: Check out v3/main only (lists + checker; never PR code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v3/main
          persist-credentials: false

      - name: Read the PR through the REST API (data only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/autonomy_class.py collect \
            --repo "$REPO" --pr "$PR_NUM" --head-sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/bundle.json"

      - name: Fetch the lockfile-pinned TypeScript parser (hash-checked)
        run: |
          set -euo pipefail
          ver=$(python3 -I -c 'import sys; sys.path.insert(0, "scripts"); import autonomy_class as a; print(a.TS_VERSION)')
          case "$ver" in *[!0-9.]*|"") echo "bad parser version"; exit 2 ;; esac
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/typescript.tgz" \
            "https://registry.npmjs.org/typescript/-/typescript-$ver.tgz"
          python3 scripts/autonomy_class.py install-parser \
            --lockfile pnpm-lock.yaml --tarball "$RUNNER_TEMP/typescript.tgz" \
            --dest "$RUNNER_TEMP/ts"
          node --version

      - name: Classify with the base branch's lists
        id: classify
        run: |
          set -euo pipefail
          python3 scripts/autonomy_class.py classify \
            --typescript "$RUNNER_TEMP/ts/package" \
            --lists .github/autonomy \
            --bundle "$RUNNER_TEMP/bundle.json" \
            --out "$RUNNER_TEMP/verdict.json" \
            --summary-out "$RUNNER_TEMP/summary.md"
          verdict=$(jq -r .verdict "$RUNNER_TEMP/verdict.json")
          case "$verdict" in auto|human) ;; *) echo "bad verdict"; exit 2 ;; esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Post the autonomy-class check-run (fails closed to human)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ steps.classify.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/summary.md"
          if [ "$VERDICT" != "auto" ] && [ "$VERDICT" != "human" ]; then
            printf '**Class: `human`** — the checker did not produce a verdict (error), so this fails closed. Run: %s\n' "$RUN_URL" > "$summary_file"
          fi
          # The (head, base) pair the verdict was computed for.
          vhead=""; base_sha=""
          if [ -f "$RUNNER_TEMP/verdict.json" ]; then
            vhead=$(jq -r '.head_sha // ""' "$RUNNER_TEMP/verdict.json" || true)
            base_sha=$(jq -r '.base_sha // ""' "$RUNNER_TEMP/verdict.json" || true)
          fi
          case "$base_sha" in *[!0-9a-f]*) base_sha="" ;; esac
          [ "${#base_sha}" -eq 40 ] || base_sha=""
          # Re-check the binding right before posting (review R3 O1): the PR's
          # head and base, and the v3/main tip, must all still match.
          if [ "$VERDICT" = "auto" ]; then
            now=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.head.sha + " " + .base.sha' || true)
            tip=$(gh api "repos/$REPO/git/ref/heads/v3/main" --jq '.object.sha' || true)
            if [ "$vhead" != "$HEAD_SHA" ] || [ -z "$base_sha" ] \
               || [ "$now" != "$HEAD_SHA $base_sha" ] || [ "$tip" != "$base_sha" ]; then
              VERDICT=human
              printf '**Class: `human`** — the PR head or base, or the v3/main tip, moved after classification (classified head %s base %s; now %s, v3/main %s). A newer run classifies the new pair. Run: %s\n' \
                "$vhead" "$base_sha" "$now" "$tip" "$RUN_URL" > "$summary_file"
            fi
          fi
          if [ "$VERDICT" = "auto" ]; then
            conclusion=success; title=auto
          else
            conclusion=neutral; title=human
          fi
          jq -n \
            --arg sha "$HEAD_SHA" --arg c "$conclusion" --arg t "$title" \
            --arg url "$RUN_URL" --arg base "${base_sha:-unbound}" \
            --rawfile s "$summary_file" \
            '{name: "autonomy-class", head_sha: $sha, status: "completed",
              conclusion: $c, details_url: $url, external_id: $base,
              output: {title: $t, summary: $s}}' \
          | gh api -X POST "repos/$REPO/check-runs" --input - > /dev/null
          echo "::notice::autonomy-class = $title ($conclusion) on head $HEAD_SHA base ${base_sha:-unbound}"
