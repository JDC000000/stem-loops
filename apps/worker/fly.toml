# Fly config for the stem-loops WORKER (queue consumer + /health).
# Deploys to the existing 'stem-loops' app. The worker polls Postgres
# (FOR UPDATE SKIP LOCKED) so it must stay running — no scale-to-zero.
app = "stem-loops"
primary_region = "iad"  # us-east, near the Supabase project; adjust to match DB region

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  # Non-secret pinned model version (ryan5453/demucs). Secrets (DATABASE_URL, R2_*,
  # REPLICATE_API_TOKEN, IP_HASH_KEY) are set via `fly secrets set`, never here.
  REPLICATE_MODEL_VERSION = "5a7041cc9b82e5a558fea6b3d7b12dea89625e89da33f0447bd727c2d0ab9e77"
  REPLICATE_DEMUCS_MODEL = "htdemucs_6s"
  # Longer separation budget for full-length real tracks (the 55s Gate-2 default
  # times out 3-4min songs). Uses the env-configurable HARD_DEADLINE (commit 3ae49c7).
  REPLICATE_DEADLINE = "300"

[http_service]
  internal_port = 8000          # /health
  force_https = true
  auto_stop_machines = 'off'    # MUST stay running to poll the queue (string 'off', not bool)
  auto_start_machines = false
  min_machines_running = 1

  # NO HTTP health check on the worker. It is a queue consumer, not a web
  # service: CPU-bound loop extraction holds the CPython GIL and starves the
  # co-located asyncio /health server, so ANY HTTP health check (even a cheap
  # non-blocking one) times out mid-job and Fly SIGTERMs a healthy-but-busy
  # worker, orphaning the job. Liveness is handled by Fly's restart-on-exit;
  # /health remains for manual probes. (Long-track hang recovery is a separate
  # pipeline concern — see the per-job timeout / loop-cap recommendation.)

[[vm]]
  # 2 shared cores so CPU-heavy loop extraction (librosa on 6 stems) runs without
  # starving the asyncio event loop / health server. 2GB for the 200MB upload cap.
  size = "shared-cpu-2x"
  memory = "2048mb"
