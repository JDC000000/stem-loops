# autonomy-class — deny-first path/content class for the bot merge path
# (AGENTIC-L5-PLAN v1.2.1 §2 R1; review carry-forwards C1-C3).
#
# Posts ONE check-run named `autonomy-class` on the PR head commit:
#   conclusion success, title `auto`   — every changed file is in Jon's allow
#                                        list, none in his deny list, and no
#                                        whole-file content / import rule fired
#   conclusion neutral, title `human`  — anything else, INCLUDING any error in
#                                        this workflow (fail closed)
#
# `auto` is an input to the bot path, never a merge by itself. This workflow
# does not label, comment, approve or merge, and auto-merge.yml does not read
# it yet (wiring it in is a separate Jon-owned change; see the PR body).
#
# ── WHY pull_request_target, AND WHY IT IS SAFE HERE ─────────────────────────
# pull_request_target runs THIS FILE as it exists on the BASE branch, with a
# token that can write check-runs. That is what makes the class trustworthy:
# a PR cannot edit the workflow, the checker (scripts/autonomy_class.py) or
# the lists (.github/autonomy/*.txt) and have its own edit judge it.
# The classic danger of pull_request_target is checking out and running PR
# code with that token. This workflow NEVER does: it checks out the base
# commit only (persist-credentials: false), and reads the PR's file list,
# patches, git modes and blob bytes through the REST API as DATA. Nothing from
# the PR is executed, imported, installed or interpolated into a script; PR
# fields reach the shell only through env vars.
#
# ── PERMISSIONS ─────────────────────────────────────────────────────────────
# checks: write (post the check-run), contents: read (git tree + blobs),
# pull-requests: read (PR + file list). Nothing else.
#
# Every `uses:` is pinned to a full 40-hex commit SHA (§11 R5 rule for merge-
# path workflows). There is exactly one: actions/checkout.

name: autonomy-class

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: autonomy-class-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: autonomy-class (compute)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the BASE commit only (lists + checker; never PR code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Read the PR through the REST API (data only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/autonomy_class.py collect \
            --repo "$REPO" --pr "$PR_NUM" --head-sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/bundle.json"

      - name: Classify with the base branch's lists
        id: classify
        run: |
          set -euo pipefail
          python3 scripts/autonomy_class.py classify \
            --lists .github/autonomy \
            --bundle "$RUNNER_TEMP/bundle.json" \
            --out "$RUNNER_TEMP/verdict.json" \
            --summary-out "$RUNNER_TEMP/summary.md"
          verdict=$(jq -r .verdict "$RUNNER_TEMP/verdict.json")
          case "$verdict" in auto|human) ;; *) echo "bad verdict"; exit 2 ;; esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Post the autonomy-class check-run (fails closed to human)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ steps.classify.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" = "auto" ]; then
            conclusion=success; title=auto
          else
            conclusion=neutral; title=human
          fi
          summary_file="$RUNNER_TEMP/summary.md"
          if [ "$VERDICT" != "auto" ] && [ "$VERDICT" != "human" ]; then
            printf '**Class: `human`** — the checker did not produce a verdict (error), so this fails closed. Run: %s\n' "$RUN_URL" > "$summary_file"
          fi
          jq -n \
            --arg sha "$HEAD_SHA" --arg c "$conclusion" --arg t "$title" \
            --arg url "$RUN_URL" --rawfile s "$summary_file" \
            '{name: "autonomy-class", head_sha: $sha, status: "completed",
              conclusion: $c, details_url: $url,
              output: {title: $t, summary: $s}}' \
          | gh api -X POST "repos/$REPO/check-runs" --input - > /dev/null
          echo "::notice::autonomy-class = $title ($conclusion) on $HEAD_SHA"
