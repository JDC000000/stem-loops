# Fly config for the stem-loops WORKER (queue consumer + /health).
# Deploys to the existing 'stem-loops' app. The worker polls Postgres
# (FOR UPDATE SKIP LOCKED) so it must stay running — no scale-to-zero.
app = "stem-loops"
primary_region = "iad"  # us-east, near the Supabase project; adjust to match DB region

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  # Non-secret pinned model version (ryan5453/demucs). Secrets (DATABASE_URL, R2_*,
  # REPLICATE_API_TOKEN, IP_HASH_KEY) are set via `fly secrets set`, never here.
  REPLICATE_MODEL_VERSION = "5a7041cc9b82e5a558fea6b3d7b12dea89625e89da33f0447bd727c2d0ab9e77"
  REPLICATE_DEMUCS_MODEL = "htdemucs_6s"
  # Generous separation CEILING (not a throughput knob): separation runs on
  # Replicate's GPUs, so compute time is caller-independent and 300s is ample for
  # full-length 6-stem jobs. The "SEPARATION_FAILED" reports on long tracks were the
  # worker dying/thrashing mid-poll and burning wall-clock — fixed by the memory +
  # reaper changes below — NOT the number being too small. Don't raise without data.
  REPLICATE_DEADLINE = "300"
  # Cap CPU-bound loop-encode threads on this 1-core VM: 8 (Option A default) give no
  # throughput gain here and multiply peak memory. See pipeline.encode_and_upload.
  LOOP_ENCODE_WORKERS = "2"

[http_service]
  internal_port = 8000          # /health
  force_https = true
  # Always-on poll worker (consumes the DB queue; no incoming HTTP traffic) — keep exactly
  # one Machine up at all times:
  #   • auto_start_machines = true + min_machines_running = 1 → Fly proactively keeps 1
  #     Machine running and RESTARTS it after every deploy. (QA fix: a redeploy previously
  #     left the consumer STOPPED because min_machines_running is INERT while auto_start is
  #     false, and nothing auto-restarts it → manual `fly machine start` was required.)
  #   • auto_stop stays 'off' (NOT the suggested auto_stop): a poll worker can't be safely
  #     auto-stopped — no request traffic to auto_start-wake it, and a long separation looks
  #     idle to Fly's I/O-wait detection so it'd be killed mid-job (the keepalive caveat).
  #     Budget is handled by the smaller VM below instead, not by stopping the worker.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # NO HTTP health check on the worker. It is a queue consumer, not a web
  # service: CPU-bound loop extraction holds the CPython GIL and starves the
  # co-located asyncio /health server, so ANY HTTP health check (even a cheap
  # non-blocking one) times out mid-job and Fly SIGTERMs a healthy-but-busy
  # worker, orphaning the job. Liveness is handled by Fly's restart-on-exit;
  # /health remains for manual probes. (Long-track hang recovery is a separate
  # pipeline concern — see the per-job timeout / loop-cap recommendation.)

[[vm]]
  # FIRST full-length verify runs at 4GB / shared-cpu-2x — SAFE headroom, guaranteed to
  # complete. Why start safe not lean (coordinator catch): no genuine >5min extraction has
  # EVER completed — Fly's 5-minute TRIAL machine cap always killed it first — so the real
  # memory peak is UNMEASURED. A full-length track yields more loops = more memory than
  # anything we've observed, and OOMing the first DEFINITIVE verify run would waste a real
  # Replicate spend. So: run this once at 4GB, measure the ACTUAL peak, THEN downsize to the
  # lean steady-state — shared-cpu-1x + 2048mb (2GB is 1x's max) — on real data, not an
  # estimate. (Right-size-down direction from b8c3185 still holds; just start the initial
  # verify safe rather than optimized. The crash-cycle root cause was the trial cap, not OOM.)
  size = "shared-cpu-2x"
  memory = "4096mb"
