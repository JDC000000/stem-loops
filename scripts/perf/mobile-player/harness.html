<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile player memory harness</title>
<script src="engine.bundle.js"></script>
<script>
// Drives the REAL production engine (apps/web/src/lib/play/engine.ts, bundled
// unchanged by measure.mjs). The only thing varied is the AudioContext sample
// rate, injected through the engine's own `createAudioContext` option.
const STEMS = ['drums', 'bass', 'guitar', 'keys', 'vocals', 'other'];
window.fetchStems = async (dur) => {
  window.__bytes = [];
  for (const name of STEMS) {
    const r = await fetch(`audio/${dur}/${name}.opus`);
    window.__bytes.push({ name, bytes: await r.arrayBuffer() });
  }
  return window.__bytes.reduce((n, s) => n + s.bytes.byteLength, 0);
};
// `rate` null = what PRODUCTION picks on this device: the real device rule
// (device-support.ts) reads this page's signals, and its profile chooses the
// decode rate and whether the mix goes through the background <audio> route.
// A number forces that rate (comparison arms only), keeping the device's route.
window.runLoad = async (rate) => {
  const profile = SL.playbackProfile(SL.readDeviceSignals(window));
  const output = profile.backgroundOutput ? SL.createBackgroundOutput(document) : null;
  window.__output = output;
  window.__profile = profile;
  const engine = SL.createPlayEngine({
    decodeSampleRate: rate ?? profile.decodeSampleRate,
    ...(output ? { createOutput: output.createOutput } : {}),
  });
  window.__engine = engine;
  const t0 = performance.now();
  await engine.load(window.__bytes);
  const ms = performance.now() - t0;
  const s = engine.getSnapshot();
  return { ms, status: s.status, durationSec: s.durationSec, error: s.error && s.error.code,
           stems: s.stems.filter((x) => x.availability === 'ready').length,
           ctxRate: engine.sampleRate, reason: profile.reason, routed: !!(output && output.routed) };
};
// Play for `sec` seconds the way the Player does (element first, then engine),
// then report whether audio time advanced and the route held.
window.runPlay = async (sec) => {
  const e = window.__engine;
  window.__output?.play();
  e.play();
  const p0 = e.getSnapshot().positionSec;
  await new Promise((r) => setTimeout(r, sec * 1000));
  const s = e.getSnapshot();
  const out = { status: s.status, advancedSec: s.positionSec - p0, routed: !!(window.__output && window.__output.routed) };
  e.pause();
  window.__output?.pause();
  return out;
};
window.env = () => ({
  ua: navigator.userAgent, w: innerWidth, h: innerHeight, dpr: devicePixelRatio,
  deviceMemory: navigator.deviceMemory ?? null,
  coarse: matchMedia('(pointer: coarse)').matches,
  hoverNone: matchMedia('(hover: none)').matches,
  anyFine: matchMedia('(any-pointer: fine)').matches,
  uaDataMobile: navigator.userAgentData ? navigator.userAgentData.mobile : null,
  maxTouch: navigator.maxTouchPoints,
});
</script>
