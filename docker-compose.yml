version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stemloops
      POSTGRES_PASSWORD: stemloops
      POSTGRES_DB: stemloops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stemloops"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/stem-loops-dev;
      mc anonymous set download local/stem-loops-dev;
      echo 'MinIO bucket ready';
      "

  worker:
    build:
      context: apps/worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://stemloops:stemloops@postgres:5432/stemloops
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_ENDPOINT_URL: http://minio:9000
      R2_BUCKET_NAME: stem-loops-dev
      IP_HASH_KEY: dev-ip-hash-key-not-for-production
      HISTORY_COOKIE_KEY: dev-cookie-key-not-for-production
      STUB_MODE: "true"
      LOG_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./apps/worker/src:/app/src
    command: python -m src.worker.main

volumes:
  postgres_data:
  minio_data:
