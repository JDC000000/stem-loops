name: Deploy

# OPERATING RULES (deploy guard, JON approval: LEDGER-22A row 7):
# - Dispatch only from v3/main (`--ref v3/main`). The gate fails any other ref, and
#   both deploy jobs use Environment `production`, which only v3/main may deploy to.
# - NEVER `gh run rerun` (or "Re-run jobs" on) a deploy run. A re-run replays the
#   ORIGINAL run's workflow file and SHA; a red gate means: wait until v3/main CI
#   on the head is green, then dispatch a NEW run.
# - `gate_only: true` runs only the gate (both deploy jobs are skipped): use it to
#   exercise the gate live without deploying.
# - Job `ruleset-drift` only warns (::warning) when ruleset 26478884's required
#   contexts differ from scripts/ci_green_gate.py REQUIRED_CONTEXTS; no deploy job
#   needs it, so a read error can never block a (revert) redeploy.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - worker
      gate_only:
        description: 'Run only the CI green gate; skip both deploy jobs'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  ci-green-gate:
    # Fail closed BEFORE any deploy step unless (0) the run's ref is
    # refs/heads/v3/main and the gated SHA/ref/run id equal the runner's own
    # GITHUB_SHA/GITHUB_REF/GITHUB_RUN_ID, (1) the SHA being deployed
    # (github.sha: the head of the dispatched ref) is on v3/main, (2) every
    # required check of ruleset 26478884 has a GitHub Actions check-run on that
    # exact SHA that concluded success (in_progress, queued, skipped, neutral,
    # missing ... all fail), and (3) every other GitHub Actions check-run on the
    # SHA is completed with success or skipped, except this deploy workflow's own
    # runs (identified by check suite id). Logic + tests: scripts/ci_green_gate.py,
    # scripts/test_ci_green_gate.py. Every deploy job `needs:` this job and has no
    # always()/failure() in its `if:`, so a red gate skips the deploy.
    # Why: S20 #376 (19 min early) and S21 #420 (9 s after merge) deployed the
    # worker while v3/main CI on that SHA was still running.
    # Tightening only (JON approval: LEDGER-22A row 7).
    name: CI green gate (deployed SHA on v3/main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read   # list deploy.yml runs on the SHA, to exclude this workflow's own check suites
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch check-runs and v3/main ancestry for the deployed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[]' > "$RUNNER_TEMP/check-runs.ndjson"
          gh api "repos/$REPO/compare/$SHA...v3/main" \
            --jq '{status: .status, merge_base: .merge_base_commit.sha}' > "$RUNNER_TEMP/compare.json"
          gh api --paginate "repos/$REPO/actions/workflows/deploy.yml/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[] | {id: .id, check_suite_id: .check_suite_id, path: .path}' > "$RUNNER_TEMP/deploy-runs.ndjson"
          gh api "repos/$REPO/actions/runs/$RUN_ID" \
            --jq '{id: .id, check_suite_id: .check_suite_id, path: .path}' >> "$RUNNER_TEMP/deploy-runs.ndjson"
      - name: Require main CI green on the deployed SHA
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -I -u scripts/ci_green_gate.py --sha "$SHA" --ref "$REF" --run-id "$RUN_ID" \
            --runs "$RUNNER_TEMP/check-runs.ndjson" --compare "$RUNNER_TEMP/compare.json" \
            --deploy-runs "$RUNNER_TEMP/deploy-runs.ndjson"

  ruleset-drift:
    # NON-blocking: no deploy job needs this job and its step cannot fail. It warns
    # when ruleset 26478884's required contexts differ from REQUIRED_CONTEXTS, or
    # when the rules cannot be read. Never make a deploy job depend on it.
    name: Ruleset drift warning (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Warn if ruleset 26478884 required contexts drifted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if gh api --paginate "repos/$REPO/rules/branches/v3/main" --jq '.[]' > "$RUNNER_TEMP/rules.ndjson"; then
            python3 -I -u scripts/ci_green_gate.py --drift "$RUNNER_TEMP/rules.ndjson" \
              || echo "::warning title=ruleset drift::drift check exited non-zero (ignored)"
          else
            echo "::warning title=ruleset drift::cannot read v3/main branch rules with this token; drift not checked"
          fi
          exit 0

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    needs: ci-green-gate
    if: ${{ inputs.gate_only != true && (inputs.target == 'all' || inputs.target == 'web') }}
    # Only v3/main may deploy to `production` (Jon's Environment setting); the deploy
    # secrets live in the Environment, so no other ref's workflow receives them.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      # No `version:` here (QA-60). package.json pins `packageManager: pnpm@9.0.0`, and
      # pnpm/action-setup fails with "Multiple versions of pnpm specified" when both are
      # given. Same as every pnpm setup in ci.yml.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 -- version from package.json packageManager
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-worker:
    name: Deploy Worker to Fly.io
    runs-on: ubuntu-latest
    needs: ci-green-gate
    if: ${{ inputs.gate_only != true && (inputs.target == 'all' || inputs.target == 'worker') }}
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be  # 1.5
      - name: Deploy to Fly.io
        # --ha=false: this app must stay at ONE Machine (FOR UPDATE SKIP LOCKED makes
        # two safe, but min_machines_running is a floor and HA would add a second).
        #
        # The binary is `flyctl`, NOT `fly`. setup-flyctl installs it as `flyctl`;
        # `fly` is a convenience alias that exists in some local installs and does
        # NOT exist on the runner. The workflow's first and only run died here with
        # `fly: command not found` (exit 127) -- diagnosed 2026-11-10 against Fly's
        # own CI guide, which uses `flyctl deploy`.
        #
        # --remote-only builds on Fly's builders instead of the runner, which is what
        # Fly's guide recommends for CI and removes any dependency on the runner's
        # Docker/buildx setup.
        run: cd apps/worker && flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
