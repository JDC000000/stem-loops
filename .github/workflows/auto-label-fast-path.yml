# Auto-label PRs whose entire diff falls inside the fast-path allowlist
# as `fast-path`. Companion to auto-merge.yml: a `fast-path` label can
# substitute for `adversarial-reviewed` in the merge gate because the
# allowlisted paths cannot carry security-adjacent changes.
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ INVARIANT: the DENY list is evaluated FIRST and ALWAYS WINS.              ║
# ║ A path matching both lists is REFUSED. Never reorder these two phases.    ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Fast-path allowlist (every changed file must match ONE of these):
#   - docs/**
#   - *.md (anywhere)
#   - apps/*/tests/**
#   - apps/web/src/**/__tests__/**
#   - packages/types/src/generated.ts
#   - scripts/**           (T3, 2026-11-05 — minus the deny list below)
#   - apps/training/**     (re-added 2026-11-05 alongside #117, which added the
#                          `training-tests` CI job it depends on)
#   - apps/web/src/**      (L2.3, 2026-11-05 — see preconditions below)
#   - apps/worker/src/**   (L2.3, 2026-11-05 — see preconditions below)
#   - fixtures/**         (2026-11-06 — root only; shared test data, not executable)
#
# Deny list — evaluated first, always wins:
#   SAFETY MACHINERY (a change here could weaken a gate and ship that
#   weakening in one action):
#     - scripts/safe_merge.sh
#     - scripts/check_*.py
#     - .githooks/
#   MONEY + CONTEXT paths the widened allowlist could otherwise reach:
#     - apps/web/src/lib/billing/
#     - apps/web/src/app/api/billing/
#     - apps/web/src/app/api/entitlements/
#     - apps/worker/src/worker/billing/
#     - apps/worker/migrations/*_v3_commercial*.sql
#     - AGENTS.md
#
# Why AGENTS.md is in the DENY list and not merely a CODEOWNERS path:
#   it matches this file's own `*.md (anywhere)` allowlist term. Before L2.3 it
#   was therefore fast-path-REACHABLE, and the only thing stopping it was the
#   `needs-jon-approval` label arriving in time. That is a race between two
#   workflows on the same PR. The deny list needs no race to win.
#
# Same reasoning for the billing paths: auto-label-codeowners.yml already
# labels them and auto-merge.yml refuses that label, but defence in depth
# means a money path can never be labelled fast-path even if the two
# labellers disagree about timing.
#
# L2.3 PRECONDITIONS — both verified live before apps/*/src/ was added:
#   1. v3/main ruleset 26478884 carries required_status_checks (Lint, Tests,
#      Types drift check, Fixture pipeline (stub), RLS gate (SL-B26 #1)) with
#      bypass_actors empty, so GitHub itself refuses a red merge. Before that,
#      "no merge on red CI" was enforced only by scripts/safe_merge.sh — a
#      script a human had to remember to run (audit finding F1, HIGH).
#   2. The `training-tests` job is live on v3/main (#117).
#   3. Added by L2.3 itself: the `Web build` job in ci.yml. Nothing built
#      apps/web before it, so widening to apps/web/src/ without it would have
#      let a broken production build auto-merge. ⚠️ `Web build` must also be a
#      REQUIRED CONTEXT on ruleset 26478884 or it reports without blocking —
#      tracked in issue #132.
#
# History of the apps/training/** line — read before touching it:
#   #118 (T3) added it on the stated condition that a `training-tests` CI job
#   be live on v3/main first. That job was in a separate PR (#117) which did
#   not merge, so for ~3 hours the training tree could auto-merge against
#   `compileall` alone — a syntax-only check that imports nothing and runs no
#   tests. #122 removed the line and recorded that it must be re-added in the
#   SAME PR that lands the job. This is that PR: the allowance and its gate
#   ship in one commit and cannot drift apart again.
#
#   If you ever need to remove the training-tests job, remove this allowlist
#   line in the same commit. They are a pair.
#
# A DENY list is evaluated BEFORE the allowlist and always wins:
#   - scripts/safe_merge.sh, scripts/check_*.py, .githooks/
# These are the merge rail and the CI gates. Letting a change to them
# auto-merge would let it weaken a gate and ship that weakening at once.
#
# If ANY file in the diff falls outside the allowlist, the label is not
# applied (and if previously applied by an earlier push, it is removed).
#
# Security: pull_request_target has write access but does NOT check out PR
# code; only the label operation runs. Only repo collaborators can apply
# labels so a hostile PR author cannot self-label into fast-path. The
# auto-merge workflow additionally requires !needs-jon-approval, so if a
# fast-path diff somehow touches a CODEOWNERS path the merge still blocks.
#
# See claude/session-7-handover.md §4 (T2 auto-merge) and V-1 recommendation.

name: Auto-label fast-path PRs

on:
  pull_request_target:
    # `unlabeled` is here for ONE reason: without it, clearing
    # `needs-jon-approval` left the PR with no `fast-path` and nothing to
    # re-evaluate, so it needed a fresh push or a hand-applied label to become
    # mergeable again. That is a friction regression this guard introduced, and
    # the job-level `if` below narrows the trigger to exactly that case.
    types: [opened, synchronize, reopened, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-label-fast-path-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label-fast-path:
    # On `unlabeled`, run ONLY when `needs-jon-approval` was the label removed.
    # Without this narrowing, the stale-approval guard stripping `fast-path`
    # would itself fire this workflow, which would re-add `fast-path` -- the
    # exact 0-3 second loop this PR exists to stop, recreated on a new trigger.
    if: >-
      github.event.action != 'unlabeled' ||
      github.event.label.name == 'needs-jon-approval'
    runs-on: ubuntu-latest
    steps:
      # L2.1 ROOT CAUSE FIX. This workflow used to label with GITHUB_TOKEN.
      # GitHub deliberately does NOT emit workflow-triggering events for
      # actions taken by GITHUB_TOKEN (loop prevention), so the `labeled`
      # event never fired and auto-merge.yml -- which triggers on
      # [labeled, synchronize, opened, reopened] -- never saw the label.
      # Its only run was on `opened`, before this job had labelled anything,
      # so it skipped. Net effect: auto-merge could never fire on ANY PR,
      # however correct its own gating was. Verified on PRs #136-#139:
      # #138 carried `fast-path` and auto-merge still reported "skipped".
      #
      # An App installation token DOES trigger downstream workflows. Same
      # mint pattern (and same fallback order) as auto-merge.yml.
      #
      # continue-on-error is deliberate: if APP_ID / APP_PRIVATE_KEY are
      # unset or the mint fails, labelling must still happen. The fallback
      # then reproduces today's behaviour -- labels get applied but do not
      # chain to auto-merge. The `secrets` context is not available in a
      # step-level `if`, which is why this is continue-on-error.
      - name: Mint GitHub App token (optional — falls back to BOT_TOKEN)
        id: apptoken
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Report which credential will label (decides if auto-merge chains)
        env:
          HAVE_APP: ${{ steps.apptoken.outputs.token != '' }}
          HAVE_BOT: ${{ secrets.BOT_TOKEN != '' }}
        run: |
          # Never echo a token. Only say which source won.
          if [ "$HAVE_APP" = "true" ]; then
            echo "::notice::labelling as the stem-loops-automerge GitHub App (L2.1) — the label WILL trigger auto-merge.yml"
          elif [ "$HAVE_BOT" = "true" ]; then
            echo "::notice::App token unavailable — falling back to BOT_TOKEN; the label will trigger auto-merge.yml"
          else
            echo "::notice::App token and BOT_TOKEN both unavailable — falling back to GITHUB_TOKEN"
            echo "::warning::Labels applied with GITHUB_TOKEN do NOT emit a \`labeled\` event, so auto-merge.yml will not run and nothing will auto-merge. Set APP_ID + APP_PRIVATE_KEY (or BOT_TOKEN) to close the chain."
          fi

      - name: Classify diff and label
        env:
          # Preference order: App installation token (L2.1) > BOT_TOKEN >
          # GITHUB_TOKEN. Only the first two cause the resulting `labeled`
          # event to trigger auto-merge.yml.
          GH_TOKEN: ${{ steps.apptoken.outputs.token || secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=$(gh pr diff "$PR_NUM" --repo "$REPO" --name-only)
          echo "Changed files in PR #$PR_NUM:"
          echo "$changed"
          echo

          # Empty diff — should never happen, but guard. An empty diff
          # should NOT get fast-path; let it fall through.
          if [ -z "$changed" ]; then
            echo "Empty diff; not applying fast-path."
            gh pr edit "$PR_NUM" --repo "$REPO" --remove-label fast-path 2>/dev/null || true
            exit 0
          fi

          # ── Phase 1: DENY list, checked FIRST ────────────────────────────
          # These paths are the safety machinery itself. A change here that
          # auto-merged could weaken a gate and ship that weakening in the
          # same action. They are excluded even though they sit inside
          # otherwise-allowed directories.
          #   scripts/safe_merge.sh  — the M-1 merge rail
          #   scripts/check_*.py     — the RLS / TSD / price-recon CI gates
          #   .githooks/             — the R-1 pre-commit guard
          # ── L2.3 (2026-11-05): deny list extended alongside the widening ──
          #
          # Evaluated FIRST and always wins. Two groups:
          #
          # (a) The safety machinery itself — a change here could weaken a gate
          #     and ship that weakening in one action.
          #       scripts/safe_merge.sh, scripts/check_*.py, .githooks/
          #
          # (b) Every CODEOWNERS path that the widened allowlist could now
          #     otherwise reach. DEFENCE IN DEPTH: auto-label-codeowners.yml
          #     already applies needs-jon-approval to these, and auto-merge.yml
          #     refuses that label — but those are two workflows racing on the
          #     same PR. The deny list needs no race to win, so a money path can
          #     never be labelled fast-path even if the labellers disagree.
          #
          #     AGENTS.md is in this group for a reason that is easy to miss:
          #     it is a CODEOWNERS path AND it matches the allowlist's own
          #     `.+\.md$` term, so it was reachable by fast-path before this
          #     change and protected only by the label race.
          deny_re='^(scripts/safe_merge\.sh$|scripts/check_[^/]*\.py$|\.githooks/|apps/web/src/lib/billing/|apps/web/src/app/api/billing/|apps/web/src/app/api/entitlements/|apps/worker/src/worker/billing/|apps/web/src/middleware\.ts$|apps/web/src/app/auth/|apps/web/src/lib/auth/|apps/worker/migrations/[^/]*_v3_commercial[^/]*\.sql$|AGENTS\.md$)'
          denied=$(echo "$changed" | grep -E "$deny_re" || true)
          if [ -n "$denied" ]; then
            echo "Safety-critical paths touched; fast-path refused:"
            echo "$denied"
            gh pr edit "$PR_NUM" --repo "$REPO" --remove-label fast-path 2>/dev/null || true
            exit 0
          fi

          # ── Phase 2: ALLOW list. ALL files must match one of these ───────
          # Grouped: docs dir | any-dir markdown | per-app tests dir |
          # web __tests__ under src | generated types | training tree |
          # scripts (minus the denies above).
          #
          # apps/training/** — the T3 justification (no production surface:
          # the worker Docker context is apps/worker, so apps/training never
          # ships; no user data; no money path) holds, AND the condition it
          # was always contingent on is now satisfied in this same commit:
          # the `training-tests` job below runs the full suite (256 passed,
          # 0 failed as of this commit) and is NOT continue-on-error, so a
          # red training suite blocks the merge.
          #
          # Do not re-add this line in a PR that does not also carry a
          # working training-tests job. See the header for why.
          #
          # scripts/** added same date: removed from CODEOWNERS by the T1
          # trim, and the safety-critical members are caught by deny_re.
          # ── L2.3 (2026-11-05): widened to application source ──
          #
          # Added: apps/web/src/ and apps/worker/src/ — the change that moves
          # ordinary app-code PRs onto the automation path.
          #
          # Both preconditions were verified live before this landed:
          #   1. v3/main ruleset 26478884 now carries required_status_checks
          #      (Lint, Tests, Types drift check, Fixture pipeline (stub),
          #      RLS gate (SL-B26 #1)) with bypass_actors empty, so GitHub
          #      itself refuses a red merge. Previously enforced only by
          #      scripts/safe_merge.sh, a script a human had to remember.
          #   2. The training-tests job is live on v3/main (#117), which is
          #      what made apps/training/ legitimate in this list.
          #
          # A third precondition was added by this PR: the `Web build` job in
          # ci.yml. Nothing built apps/web before it, so widening to
          # apps/web/src/ without it would have let a broken production build
          # auto-merge. Add `Web build` to the ruleset's required contexts.
          allow_re='^(docs/|.+\.md$|apps/[^/]+/tests?/|apps/web/src/.+/__tests__/|packages/types/src/generated\.ts$|apps/training/|apps/web/src/|apps/worker/src/|scripts/|fixtures/)'

          # fixtures/ added 2026-11-06: shared Python<->TypeScript test data
          # (e.g. fixtures/contracts/harte-labels.json, play-chords.golden.json).
          # It is DATA, not executable code: nothing under it is imported into
          # a build, run in production, or deployed, so it carries no
          # security-adjacent change. A single golden file read by both
          # languages must live at repo root because neither side owns it; a
          # test-only PR (#151) was falling off the fast path purely for being
          # well-tested. Anchored by the leading ^ of the alternation, so this
          # matches ONLY the root fixtures/ directory, not apps/*/fixtures/ or
          # any other nested fixtures/ (those are still judged by their own
          # app-level terms above).
          # Find any file NOT matching the allowlist.
          bad=$(echo "$changed" | grep -vE "$allow_re" || true)

          if [ -n "$bad" ]; then
            echo "Files outside fast-path allowlist:"
            echo "$bad"
            # Remove any stale fast-path label.
            gh pr edit "$PR_NUM" --repo "$REPO" --remove-label fast-path 2>/dev/null || true
            exit 0
          fi

          # ── Phase 3: do not re-arm fast-path on a PR awaiting Jon ───────
          # MEASURED DEFECT, 2026-11-10 (PR #176 timeline, four occurrences):
          #   19:58:42  unlabeled  fast-path  by github-actions[bot]
          #   19:58:45  labeled    fast-path  by stem-loops-automerge[bot]
          #   20:44:12  unlabeled  fast-path  by github-actions[bot]
          #   20:44:12  labeled    fast-path  by stem-loops-automerge[bot]   <- same second
          #
          # auto-merge.yml's stale-approval guard strips `fast-path` and
          # `adversarial-reviewed` on every new commit, so a new commit has to
          # earn its way through again. This workflow fires on the SAME
          # `synchronize` event and re-applied the label within 0-3 seconds,
          # every time. The guard was inert.
          #
          # HONEST SCOPE, after an independent review corrected the first
          # draft of this comment. `needs-jon-approval` ALREADY hard-blocks
          # auto-merge at two layers -- the job-level `if` and a live re-check
          # against the PR's current labels. So on a PR carrying it, `fast-path`
          # could never have merged anyway. **This guard buys label hygiene on
          # those PRs, NOT merge protection**, and it does not close the
          # 0-3 second re-arm window for any PR that could actually auto-merge.
          #
          # The exposure it is adjacent to is still real: the gate is
          #   rollback-safe AND green CI AND (adversarial-reviewed OR fast-path)
          #   AND NOT needs-jon-approval
          # so `fast-path` ALONE satisfies the review arm, and stripping it on a
          # new commit is the only thing forcing a re-look. Closing THAT needs
          # auto-merge.yml, which agents may author against but never merge.
          #
          # A PR carrying `needs-jon-approval` is by definition one Jon must read.
          # Re-arming its fast-path label buys nothing and erodes the guard, so we
          # skip -- and clear any stale label, matching the early-exit branches
          # above. Once Jon clears `needs-jon-approval`, the next synchronize
          # re-evaluates the diff and applies the label legitimately.
          #
          # This is a PARTIAL mitigation. The general race -- guard and labeller
          # both firing on `synchronize` -- still exists for PRs WITHOUT
          # `needs-jon-approval`, and fixing that properly needs auto-merge.yml,
          # which is a no-fly file for agents.
          # FAIL CLOSED. `set -e` is suspended inside an `if` condition, so a
          # failed API read would evaluate false and arm the label anyway --
          # silence and success sharing an exit code, which is this project's
          # house bug. Read first, capture the failure explicitly, and treat an
          # unreadable label set exactly like `needs-jon-approval` being present.
          # --paginate: the API returns 30 labels per page by default, so a
          # label-heavy PR could hide `needs-jon-approval` past the first page
          # and fail OPEN. A gate must not depend on a default page size.
          labels=$(gh api --paginate "repos/$REPO/issues/$PR_NUM/labels" --jq '.[].name') \
            || labels='__LABEL_READ_FAILED__'

          # A here-string, NOT `printf | grep`. Under `pipefail`, `grep -q` exits
          # on first match, `printf` takes SIGPIPE, and the pipeline returns 141 --
          # which reads as NO MATCH and fails OPEN. Unreachable at ~20 labels, but
          # this is a gate and it is the same bug class the block below warns about.
          if grep -qx -e 'needs-jon-approval' -e '__LABEL_READ_FAILED__' <<<"$labels"; then
            if grep -qx '__LABEL_READ_FAILED__' <<<"$labels"; then
              echo "::warning::Could not read labels for PR #$PR_NUM; refusing to arm fast-path."
            else
              echo "PR #$PR_NUM carries needs-jon-approval; not arming fast-path."
            fi
            gh pr edit "$PR_NUM" --repo "$REPO" --remove-label fast-path 2>/dev/null || true
            exit 0
          fi

          echo "All files match fast-path allowlist. Applying label."
          # Also apply rollback-safe since docs/tests/generated-types are
          # intrinsically revertable with git revert.
          gh pr edit "$PR_NUM" --repo "$REPO" \
            --add-label fast-path --add-label rollback-safe
