name: CI

# NOTE: `main` alone meant CI had not run since 2026-06-29 — all of Phase 1-3
# landed on phase-* branches, so every job below was dead code. Trigger on the
# active integration branch too, otherwise none of these checks protect anything.
on:
  push:
    branches: [main, phase-3-ux]
  pull_request:
    branches: [main, phase-3-ux]

jobs:
  types-drift:
    name: Types drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install pydantic>=2.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
        working-directory: packages/types
      - name: Regenerate types
        run: cd packages/types && python scripts/codegen.py
      - name: Check for type drift
        run: |
          if ! git diff --exit-code packages/types/src/; then
            echo "TYPE DRIFT DETECTED: run 'make types-generate' and commit the result"
            git diff packages/types/src/
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install ruff black
      - name: ruff check
        run: cd apps/worker && python -m ruff check src/ tests/
      - name: black check
        run: cd apps/worker && python -m black --check src/ tests/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm --filter web lint
      # ESLint does not type-check. Without this a type error only surfaces when
      # `vercel deploy --prod` fails — i.e. mid-deploy (regression: an earlier
      # version of this workflow ran tsc).
      - name: TypeScript typecheck
        run: pnpm --filter web exec tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r apps/worker/requirements.txt
      - name: pytest
        run: cd apps/worker && python -m pytest tests/ -v
        env:
          # The worker package is not pip-installed here, so `from worker import ...`
          # only resolves via the source tree.
          PYTHONPATH: ${{ github.workspace }}/apps/worker/src
          STUB_MODE: "true"
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_ENDPOINT_URL: http://localhost:9000
          R2_BUCKET_NAME: test-bucket
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Node tests
        run: pnpm test

  # Every other job runs against the checked-out source on the runner, so the
  # Dockerfile was only ever exercised for the first time by a production
  # `fly deploy`. Any COPY-set / system-dep / requirements drift was invisible
  # until then. This builds the real image and proves the entrypoint imports.
  worker-image:
    name: Worker image build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t stem-loops-worker:ci apps/worker
      - name: Smoke test — entrypoint imports inside the image
        run: |
          docker run --rm stem-loops-worker:ci \
            python -c "import src.worker.main; print('worker entrypoint import OK')"
      - name: Smoke test — health app and migrations are packaged
        run: |
          docker run --rm stem-loops-worker:ci python -c "
          import glob, os
          from src.worker.health import app
          from src.worker.migrate import MIGRATIONS_DIR
          n = len(glob.glob(os.path.join(MIGRATIONS_DIR, '*.sql')))
          assert n > 0, 'no migrations packaged in the image'
          print(f'health app + {n} migrations present')
          "

  fixture-pipeline:
    name: Fixture pipeline (stub)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stemloops
          POSTGRES_PASSWORD: stemloops
          POSTGRES_DB: stemloops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r apps/worker/requirements.txt
      - name: Create MinIO bucket
        run: |
          pip install awscli
          AWS_ACCESS_KEY_ID=minioadmin \
          AWS_SECRET_ACCESS_KEY=minioadmin \
          aws --endpoint-url http://localhost:9000 s3 mb s3://stem-loops-ci
      # migrations/ holds only .sql — the runner is src/worker/migrate.py.
      - name: Run migrations
        run: cd apps/worker && python -m src.worker.migrate
        env:
          DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops

      # The audio core (extract -> tag -> seamless -> encode -> upload -> DB) on
      # synthetic stems against the real Postgres + MinIO above. This test skips
      # itself unless DATABASE_URL + R2_ACCESS_KEY_ID/SECRET/BUCKET_NAME and
      # MINIO_ENDPOINT|R2_ENDPOINT_URL are ALL set — it had been silently skipping.
      - name: Audio core end-to-end (real Postgres + MinIO)
        run: cd apps/worker && python -m pytest tests/test_pipeline_fixtures.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/worker/src
          DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
          R2_ACCESS_KEY_ID: minioadmin
          R2_SECRET_ACCESS_KEY: minioadmin
          R2_ENDPOINT_URL: http://localhost:9000
          R2_BUCKET_NAME: stem-loops-ci

      # Whole-job path: insert a queued job, run the pipeline, write loops + upload
      # objects. `--test-job` is the entrypoint's only supported flag (the previous
      # `src.main --run-once` referenced a module deleted in 95412ba).
      - name: Stub job end-to-end (queue -> pipeline -> loops -> MinIO)
        run: |
          cd apps/worker && python -m src.worker.main --test-job "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        env:
          STUB_MODE: "true"
          DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
          R2_ACCESS_KEY_ID: minioadmin
          R2_SECRET_ACCESS_KEY: minioadmin
          R2_ENDPOINT_URL: http://localhost:9000
          R2_BUCKET_NAME: stem-loops-ci
          IP_HASH_KEY: ci-test-key
          HISTORY_COOKIE_KEY: ci-cookie-key

      # Without this the step above could "pass" while producing nothing.
      - name: Verify stub job reached done with real objects behind every loop
        run: cd apps/worker && python scripts/verify_stub_job.py
        env:
          DATABASE_URL: postgresql://stemloops:stemloops@localhost:5432/stemloops
          R2_ACCESS_KEY_ID: minioadmin
          R2_SECRET_ACCESS_KEY: minioadmin
          R2_ENDPOINT_URL: http://localhost:9000
          R2_BUCKET_NAME: stem-loops-ci
