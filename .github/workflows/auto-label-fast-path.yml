# Auto-label PRs whose entire diff falls inside the fast-path allowlist
# as `fast-path`. Companion to auto-merge.yml: a `fast-path` label can
# substitute for `adversarial-reviewed` in the merge gate because the
# allowlisted paths cannot carry security-adjacent changes.
#
# Fast-path allowlist (every changed file must match ONE of these):
#   - docs/**
#   - *.md (anywhere)
#   - apps/*/tests/**
#   - apps/web/src/**/__tests__/**
#   - packages/types/src/generated.ts
#   - scripts/**         (T3, 2026-11-05 — minus the deny list below)
#   - apps/training/**   (re-added 2026-11-05 by THIS PR, #117, which also adds
#                        the `training-tests` CI job it depends on)
#
# History of the apps/training/** line — read before touching it:
#   #118 (T3) added it on the stated condition that a `training-tests` CI job
#   be live on v3/main first. That job was in a separate PR (#117) which did
#   not merge, so for ~3 hours the training tree could auto-merge against
#   `compileall` alone — a syntax-only check that imports nothing and runs no
#   tests. #122 removed the line and recorded that it must be re-added in the
#   SAME PR that lands the job. This is that PR: the allowance and its gate
#   ship in one commit and cannot drift apart again.
#
#   If you ever need to remove the training-tests job, remove this allowlist
#   line in the same commit. They are a pair.
#
# A DENY list is evaluated BEFORE the allowlist and always wins:
#   - scripts/safe_merge.sh, scripts/check_*.py, .githooks/
# These are the merge rail and the CI gates. Letting a change to them
# auto-merge would let it weaken a gate and ship that weakening at once.
#
# If ANY file in the diff falls outside the allowlist, the label is not
# applied (and if previously applied by an earlier push, it is removed).
#
# Security: pull_request_target has write access but does NOT check out PR
# code; only the label operation runs. Only repo collaborators can apply
# labels so a hostile PR author cannot self-label into fast-path. The
# auto-merge workflow additionally requires !needs-jon-approval, so if a
# fast-path diff somehow touches a CODEOWNERS path the merge still blocks.
#
# See claude/session-7-handover.md §4 (T2 auto-merge) and V-1 recommendation.

name: Auto-label fast-path PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-label-fast-path-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label-fast-path:
    runs-on: ubuntu-latest
    steps:
      - name: Classify diff and label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=$(gh pr diff "$PR_NUM" --repo "$REPO" --name-only)
          echo "Changed files in PR #$PR_NUM:"
          echo "$changed"
          echo

          # Empty diff — should never happen, but guard. An empty diff
          # should NOT get fast-path; let it fall through.
          if [ -z "$changed" ]; then
            echo "Empty diff; not applying fast-path."
            gh pr edit "$PR_NUM" --repo "$REPO" --remove-label fast-path 2>/dev/null || true
            exit 0
          fi

          # ── Phase 1: DENY list, checked FIRST ────────────────────────────
          # These paths are the safety machinery itself. A change here that
          # auto-merged could weaken a gate and ship that weakening in the
          # same action. They are excluded even though they sit inside
          # otherwise-allowed directories.
          #   scripts/safe_merge.sh  — the M-1 merge rail
          #   scripts/check_*.py     — the RLS / TSD / price-recon CI gates
          #   .githooks/             — the R-1 pre-commit guard
          # ── L2.3 (2026-11-05): deny list extended alongside the widening ──
          #
          # Evaluated FIRST and always wins. Two groups:
          #
          # (a) The safety machinery itself — a change here could weaken a gate
          #     and ship that weakening in one action.
          #       scripts/safe_merge.sh, scripts/check_*.py, .githooks/
          #
          # (b) Every CODEOWNERS path that the widened allowlist could now
          #     otherwise reach. DEFENCE IN DEPTH: auto-label-codeowners.yml
          #     already applies needs-jon-approval to these, and auto-merge.yml
          #     refuses that label — but those are two workflows racing on the
          #     same PR. The deny list needs no race to win, so a money path can
          #     never be labelled fast-path even if the labellers disagree.
          #
          #     AGENTS.md is in this group for a reason that is easy to miss:
          #     it is a CODEOWNERS path AND it matches the allowlist's own
          #     `.+\.md$` term, so it was reachable by fast-path before this
          #     change and protected only by the label race.
          deny_re='^(scripts/safe_merge\.sh$|scripts/check_[^/]*\.py$|\.githooks/|apps/web/src/lib/billing/|apps/web/src/app/api/billing/|apps/web/src/app/api/entitlements/|apps/worker/src/worker/billing/|apps/worker/migrations/[^/]*_v3_commercial[^/]*\.sql$|AGENTS\.md$)'
          denied=$(echo "$changed" | grep -E "$deny_re" || true)
          if [ -n "$denied" ]; then
            echo "Safety-critical paths touched; fast-path refused:"
            echo "$denied"
            gh pr edit "$PR_NUM" --repo "$REPO" --remove-label fast-path 2>/dev/null || true
            exit 0
          fi

          # ── Phase 2: ALLOW list. ALL files must match one of these ───────
          # Grouped: docs dir | any-dir markdown | per-app tests dir |
          # web __tests__ under src | generated types | training tree |
          # scripts (minus the denies above).
          #
          # apps/training/** — the T3 justification (no production surface:
          # the worker Docker context is apps/worker, so apps/training never
          # ships; no user data; no money path) holds, AND the condition it
          # was always contingent on is now satisfied in this same commit:
          # the `training-tests` job below runs the full suite (256 passed,
          # 0 failed as of this commit) and is NOT continue-on-error, so a
          # red training suite blocks the merge.
          #
          # Do not re-add this line in a PR that does not also carry a
          # working training-tests job. See the header for why.
          #
          # scripts/** added same date: removed from CODEOWNERS by the T1
          # trim, and the safety-critical members are caught by deny_re.
          # ── L2.3 (2026-11-05): widened to application source ──
          #
          # Added: apps/web/src/ and apps/worker/src/ — the change that moves
          # ordinary app-code PRs onto the automation path.
          #
          # Both preconditions were verified live before this landed:
          #   1. v3/main ruleset 26478884 now carries required_status_checks
          #      (Lint, Tests, Types drift check, Fixture pipeline (stub),
          #      RLS gate (SL-B26 #1)) with bypass_actors empty, so GitHub
          #      itself refuses a red merge. Previously enforced only by
          #      scripts/safe_merge.sh, a script a human had to remember.
          #   2. The training-tests job is live on v3/main (#117), which is
          #      what made apps/training/ legitimate in this list.
          #
          # A third precondition was added by this PR: the `Web build` job in
          # ci.yml. Nothing built apps/web before it, so widening to
          # apps/web/src/ without it would have let a broken production build
          # auto-merge. Add `Web build` to the ruleset's required contexts.
          allow_re='^(docs/|.+\.md$|apps/[^/]+/tests/|apps/web/src/.+/__tests__/|packages/types/src/generated\.ts$|apps/training/|apps/web/src/|apps/worker/src/|scripts/)'

          # Find any file NOT matching the allowlist.
          bad=$(echo "$changed" | grep -vE "$allow_re" || true)

          if [ -n "$bad" ]; then
            echo "Files outside fast-path allowlist:"
            echo "$bad"
            # Remove any stale fast-path label.
            gh pr edit "$PR_NUM" --repo "$REPO" --remove-label fast-path 2>/dev/null || true
            exit 0
          fi

          echo "All files match fast-path allowlist. Applying label."
          # Also apply rollback-safe since docs/tests/generated-types are
          # intrinsically revertable with git revert.
          gh pr edit "$PR_NUM" --repo "$REPO" \
            --add-label fast-path --add-label rollback-safe
